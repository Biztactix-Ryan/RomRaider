# cargo-dist configuration (story US-RR-38, INFRASTRUCTURE.md "Linux Release",
# D-022). `dist` builds the release archives; `.github/workflows/release.yml`
# drives it and publishes the GitHub Release.
#
# Which packages ship: only crates with `[package.metadata.dist] dist = true`
# (every workspace crate is `publish = false`, which dist otherwise skips).
# Today that is rr-cli (binary `romraider-cli`); rr-app (`romraider-rs`)
# joins when the desktop app is packaged.
[workspace]
members = ["cargo:."]

[dist]
# Must equal DIST_VERSION in release.yml, which installs this exact release
# and checks its SHA-256 (xtask/tests/release_ci_config.rs).
cargo-dist-version = "0.33.0"
ci = "github"
# release.yml is hand-written, not generated by `dist generate`: it adds the
# nightly channel, gates on ci.yml and leaves room for the AppImage and .deb
# jobs. "ci" here stops dist from regenerating or diffing it.
allow-dirty = ["ci"]
# No curl|sh installers: the tarball, AppImage and .deb are the Linux
# artifacts (INFRASTRUCTURE.md "Artifacts").
installers = []
targets = ["x86_64-unknown-linux-gnu"]
unix-archive = ".tar.gz"
checksum = "sha256"
# Source is on GitHub; the release carries binaries only.
source-tarball = false
# Build only the shipped packages (`cargo build -p rr-cli`), not the whole
# workspace: xtask and the test-only crates have no place in a release build.
precise-builds = true
# GPL-2.0-or-later text next to the binary (README.md is auto-included).
include = ["license.txt"]
