# Release pipeline for RomRaider-RS (story US-RR-38, INFRASTRUCTURE.md
# "Linux Release", D-022).
#
# Two channels, one pipeline:
# * nightly: every night (and on a manual run from rust-rewrite), the head of
#   the default branch is published as the moving GitHub pre-release
#   `nightly`. A scheduled run whose commit already is `nightly` does nothing.
# * tagged: pushing a tag `vX.Y.Z[-suffix]` publishes a GitHub Release for that
#   tag. The tag must equal the workspace version (`dist plan --tag` checks).
#   A `-suffix` (e.g. v0.2.0-alpha.1) marks it a pre-release.
# A manual run from any other branch, or with `dry-run`, builds and smoke-tests
# everything but publishes nothing.
#
# Nothing is built or published unless the full CI gate passed on the commit
# being released: job `ci` calls ci.yml, including the release-blocking T6
# suite and its `ci-ok` aggregate (ci.yml `t6` job comment,
# xtask/tests/t6_ci_config.rs).
#
# Builds use cargo-dist (dist-workspace.toml). This file is hand-written, not
# generated by `dist generate` (`allow-dirty = ["ci"]` there); it pins dist by
# version and SHA-256 (xtask/tests/release_ci_config.rs).
#
# Adding an artifact: add a job that `needs: [plan, build-cli]` (download the
# `release-cli-*` artifact for the binary), uploads its files as an artifact
# named `release-<something>`, and add the job id to `publish.needs`, as
# `build-appimage` (US-RR-38-6) and `build-deb` (US-RR-38-7) do. A job that
# only tests an artifact (`test-appimage`, US-RR-38-3; `test-deb`, US-RR-38-2)
# goes in `publish.needs` too, so a failing test stops the release. `publish` takes every `release-*`
# artifact, writes SHA256SUMS over all of them and attaches them all, after the release artifact content check (US-RR-38-8,
# `cargo xtask check-release-artifacts`, xtask/src/release_artifacts.rs) has
# opened every asset and found no ROM image, no fixture data and nothing off
# the release allow-list. A new artifact kind, or a new file inside one,
# fails that check until it is added there.

name: Release

on:
  schedule:
    # 03:17 UTC nightly (off the hour: scheduled runs at :00 are often delayed).
    - cron: "17 3 * * *"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and smoke-test only; publish nothing"
        type: boolean
        default: false

# One release run per ref at a time; a second one queues rather than cancels
# a half-published release. The group name must not collide (case-insensitive)
# with ci.yml's `${{ github.workflow }}-<ref>` group, which inside this run
# evaluates to "Release-<ref>": the same group in caller and callee deadlocks.
concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # cargo-dist release installed by every job that runs `dist`. Must equal
  # `cargo-dist-version` in dist-workspace.toml; the hash is the published
  # SHA-256 of cargo-dist-x86_64-unknown-linux-gnu.tar.xz for that release.
  DIST_VERSION: "0.33.0"
  DIST_SHA256: "4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293"
  # appimagetool and the AppImage type2 runtime it embeds, used by job
  # `build-appimage` (packaging/appimage/build.sh). Each hash is the published
  # SHA-256 of the x86_64 asset of that release (appimagetool-x86_64.AppImage,
  # runtime-x86_64); the runtime goes in by --runtime-file, so appimagetool
  # never downloads an unpinned one.
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGE_RUNTIME_VERSION: "20251108"
  APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
  # cargo-deb, used by job `build-deb` (packaging/deb/build.sh). Installed
  # from crates.io as exactly this version with its own Cargo.lock
  # (`cargo install --locked`), so every dependency is pinned and
  # checksum-verified.
  CARGO_DEB_VERSION: "3.8.0"
  # The clean Ubuntu 22.04 that job `test-appimage` runs the AppImage on:
  # the official ubuntu:22.04 image, pinned by its multi-arch index digest so
  # every run tests the same bytes. Bump the digest deliberately (`docker
  # buildx imagetools inspect ubuntu:22.04`).
  UBUNTU_22_04_IMAGE: "ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956"
  # The clean Ubuntus job `test-deb` installs the .deb on: the image above
  # and the official ubuntu:24.04, pinned the same way.
  UBUNTU_24_04_IMAGE: "ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac"
  # The moving pre-release tag of the nightly channel.
  NIGHTLY_TAG: nightly

defaults:
  run:
    shell: bash

jobs:
  # Decide what this run is: channel, release tag, pre-release or not, and
  # whether to build and to publish at all.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      release-tag: ${{ steps.plan.outputs.release-tag }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/dist.tar.xz" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-x86_64-unknown-linux-gnu.tar.xz"
          echo "${DIST_SHA256}  $RUNNER_TEMP/dist.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/dist.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/cargo-dist-x86_64-unknown-linux-gnu/dist" "$HOME/.local/bin/dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          SHA: ${{ github.sha }}
        run: |
          dist --version
          build=true
          publish=true
          case "$EVENT" in
            push)
              # Tag push. `dist plan --tag` fails unless the tag matches the
              # workspace version, so a mistyped tag never publishes.
              channel=tagged
              release_tag="$REF_NAME"
              dist_tag="$REF_NAME"
              ;;
            schedule|workflow_dispatch)
              channel=nightly
              release_tag="$NIGHTLY_TAG"
              # The nightly is built as the current workspace version.
              dist_tag=$(dist plan --output-format=json | jq -r '.announcement_tag')
              if [ "$EVENT" = workflow_dispatch ] && { [ "$DRY_RUN" = true ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; }; then
                echo "::notice::Dry run ($REF, dry-run=$DRY_RUN): building without publishing."
                publish=false
              fi
              if [ "$EVENT" = schedule ]; then
                current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NIGHTLY_TAG" --jq '.object.sha' 2>/dev/null || echo none)
                if [ "$current" = "$SHA" ]; then
                  echo "::notice::$NIGHTLY_TAG is already $SHA; nothing to do."
                  build=false
                  publish=false
                fi
              fi
              ;;
            *)
              echo "::error::Unexpected event $EVENT"
              exit 1
              ;;
          esac
          dist plan --tag="$dist_tag" --output-format=json > "$RUNNER_TEMP/plan.json"
          if [ "$channel" = nightly ]; then
            prerelease=true
          else
            prerelease=$(jq -r '.announcement_is_prerelease' "$RUNNER_TEMP/plan.json")
          fi
          {
            echo "build=$build"
            echo "publish=$publish"
            echo "channel=$channel"
            echo "release-tag=$release_tag"
            echo "dist-tag=$dist_tag"
            echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"

  # The full CI gate on the commit being released (ci.yml `workflow_call`).
  # Its result is success only if every ci.yml job, `t6` and `ci-ok`
  # included, succeeded.
  ci:
    name: ci
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  # romraider-cli tarball, built by cargo-dist, smoke-tested from the archive.
  # ubuntu-22.04: the binary needs at most the runner's glibc (2.35), so it
  # runs on Ubuntu 22.04 and later. (The glibc 2.28 floor in INFRASTRUCTURE.md
  # needs a cargo-zigbuild or manylinux build; not done yet.)
  build-cli:
    name: build-cli (${{ matrix.target }})
    needs: [plan, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          rustup show
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/dist.tar.xz" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-x86_64-unknown-linux-gnu.tar.xz"
          echo "${DIST_SHA256}  $RUNNER_TEMP/dist.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/dist.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/cargo-dist-x86_64-unknown-linux-gnu/dist" "$HOME/.local/bin/dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: dist build
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
        run: |
          dist build --tag="$DIST_TAG" --artifacts=local --target=${{ matrix.target }} \
            --print=linkage --output-format=json > "$RUNNER_TEMP/dist-manifest.json"
          jq -r '.upload_files[]' "$RUNNER_TEMP/dist-manifest.json"
      # dist names the archive after the crate (rr-cli-<target>.tar.gz); the
      # published asset carries the binary's name. Per-file .sha256 files are
      # dropped: `publish` writes one SHA256SUMS over every asset.
      - name: Stage release asset
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          mv "target/distrib/rr-cli-${{ matrix.target }}.tar.gz" \
            "$RUNNER_TEMP/release/romraider-cli-${{ matrix.target }}.tar.gz"
          ls -l "$RUNNER_TEMP/release"
      - name: Smoke test (romraider-cli --version from the tarball)
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "$RUNNER_TEMP/release/romraider-cli-${{ matrix.target }}.tar.gz" -C "$smoke"
          version=$("$smoke/rr-cli-${{ matrix.target }}/romraider-cli" --version)
          echo "$version"
          test "$version" = "romraider-cli $(jq -r '.releases[0].app_version' "$RUNNER_TEMP/dist-manifest.json")"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # romraider-cli AppImage (x86_64), assembled from the tarball's binary by
  # packaging/appimage/build.sh with pinned appimagetool, then smoke-tested.
  # ubuntu-22.04 like build-cli. The clean-container run of the AppImage is
  # job `test-appimage` (US-RR-38-3).
  build-appimage:
    name: build-appimage (x86_64)
    needs: [plan, build-cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      TARGET: x86_64-unknown-linux-gnu
      APPIMAGE: romraider-cli-x86_64.AppImage
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/cli
      - name: Install appimagetool
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $RUNNER_TEMP/appimagetool-x86_64.AppImage" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_SHA256}  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Build AppImage
        run: |
          tar -xzf "$RUNNER_TEMP/cli/romraider-cli-$TARGET.tar.gz" -C "$RUNNER_TEMP/cli"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
          APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-x86_64" \
            bash packaging/appimage/build.sh "$RUNNER_TEMP/cli/rr-cli-$TARGET/romraider-cli" \
            "$RUNNER_TEMP/release/$APPIMAGE"
      # Same version as the tarball's binary. --appimage-extract-and-run: the
      # AppImage must also run where FUSE is unavailable.
      - name: Smoke test (romraider-cli --version from the AppImage)
        run: |
          expected=$("$RUNNER_TEMP/cli/rr-cli-$TARGET/romraider-cli" --version)
          version=$("$RUNNER_TEMP/release/$APPIMAGE" --appimage-extract-and-run --version)
          echo "$version"
          test "$version" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage-x86_64
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # The published AppImage, exactly as uploaded, runs `romraider-cli
  # --version` on a clean Ubuntu 22.04 (US-RR-38-3): a fresh container of the
  # pinned ubuntu:22.04 image, with nothing installed in it (no Rust, no
  # FUSE, no libraries beyond the base image), no network, as an unprivileged
  # user, and the AppImage mounted read-only. --appimage-extract-and-run
  # because containers have no FUSE. The output must be the release version.
  # `publish` needs this job, so an AppImage that fails here never ships.
  test-appimage:
    name: test-appimage (ubuntu:22.04)
    needs: [plan, build-appimage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APPIMAGE: romraider-cli-x86_64.AppImage
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-appimage-x86_64
          path: ${{ runner.temp }}/appimage
      # Artifacts lose the executable bit; restore it on the host, since the
      # container sees the file read-only.
      - name: Smoke test (romraider-cli --version in a clean ubuntu:22.04 container)
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
        run: |
          chmod 0755 "$RUNNER_TEMP/appimage/$APPIMAGE"
          docker pull "$UBUNTU_22_04_IMAGE"
          version=$(docker run --rm --network none --user 65534:65534 \
            -v "$RUNNER_TEMP/appimage:/appimage:ro" "$UBUNTU_22_04_IMAGE" \
            "/appimage/$APPIMAGE" --appimage-extract-and-run --version)
          echo "$version"
          test "$version" = "romraider-cli ${DIST_TAG#v}"

  # romraider-cli .deb (amd64), packaged by cargo-deb from the tarball's binary
  # (packaging/deb/build.sh, `[package.metadata.deb]` in crates/rr-cli), then
  # installed on the runner and smoke-tested. ubuntu-22.04 like build-cli, so
  # dpkg-shlibdeps derives the same libc6 floor the binary was linked
  # against. The clean-container install test is job `test-deb` (US-RR-38-2).
  build-deb:
    name: build-deb (amd64)
    needs: [plan, build-cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/cli
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - name: Install cargo-deb
        run: |
          cargo install cargo-deb --version "${CARGO_DEB_VERSION}" --locked \
            --root "$RUNNER_TEMP/cargo-deb"
          "$RUNNER_TEMP/cargo-deb/bin/cargo-deb" --version
      - name: Build .deb
        run: |
          tar -xzf "$RUNNER_TEMP/cli/romraider-cli-$TARGET.tar.gz" -C "$RUNNER_TEMP/cli"
          deb=$(CARGO_DEB="$RUNNER_TEMP/cargo-deb/bin/cargo-deb" \
            bash packaging/deb/build.sh "$RUNNER_TEMP/cli/rr-cli-$TARGET/romraider-cli" \
            "$RUNNER_TEMP/release")
          case "$deb" in
            "$RUNNER_TEMP"/release/romraider-cli_*_amd64.deb) ;;
            *) echo "::error::unexpected package $deb"; exit 1 ;;
          esac
          echo "DEB=$deb" >> "$GITHUB_ENV"
      # Install it, run the installed binary (same version and bytes as the
      # tarball's), then remove it again.
      - name: Smoke test (dpkg -i, romraider-cli --version)
        run: |
          depends=$(dpkg-deb --field "$DEB" Depends)
          echo "Depends: $depends"
          [[ "$depends" == "libc6 "* ]]
          sudo dpkg -i "$DEB"
          expected=$("$RUNNER_TEMP/cli/rr-cli-$TARGET/romraider-cli" --version)
          version=$(/usr/bin/romraider-cli --version)
          echo "$version"
          test "$version" = "$expected"
          cmp /usr/bin/romraider-cli "$RUNNER_TEMP/cli/rr-cli-$TARGET/romraider-cli"
          test -f /usr/share/applications/romraider-cli.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/romraider-cli.svg
          sudo dpkg -r romraider-cli
          test ! -e /usr/bin/romraider-cli
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb-amd64
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # The published .deb, exactly as uploaded, installs with `dpkg -i` and runs
  # `romraider-cli --version` in a clean Ubuntu container (US-RR-38-2): a
  # fresh container of each pinned Ubuntu LTS image (22.04, the oldest the
  # binary's glibc supports, and 24.04), with nothing installed beyond the
  # base image and no network, so nothing can be pulled in: dpkg fails unless
  # the package's Depends (the libc6 floor) is already met by the base
  # system. Root inside the container, because dpkg needs it; the .deb is
  # mounted read-only. The container checks it is the Ubuntu it should be,
  # that the binary landed in /usr/bin, and its output must be the release
  # version. `publish` needs this job, so a .deb that fails here never ships.
  test-deb:
    name: test-deb (ubuntu:${{ matrix.ubuntu }})
    needs: [plan, build-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            image-env: UBUNTU_22_04_IMAGE
          - ubuntu: "24.04"
            image-env: UBUNTU_24_04_IMAGE
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-deb-amd64
          path: ${{ runner.temp }}/deb
      # Exactly one package was uploaded; its file name carries the Debian
      # version (a pre-release `-suffix` becomes `~suffix`), so find it.
      - name: Smoke test (dpkg -i, romraider-cli --version in a clean ubuntu container)
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
          IMAGE: ${{ env[matrix.image-env] }}
          UBUNTU: ${{ matrix.ubuntu }}
        run: |
          debs=("$RUNNER_TEMP"/deb/romraider-cli_*_amd64.deb)
          test "${#debs[@]}" -eq 1
          test -f "${debs[0]}"
          deb=$(basename "${debs[0]}")
          docker pull "$IMAGE"
          version=$(docker run --rm --network none \
            -v "$RUNNER_TEMP/deb:/deb:ro" "$IMAGE" sh -euc '
              . /etc/os-release
              test "$VERSION_ID" = "$1"
              dpkg -i "/deb/$2" >&2
              test "$(command -v romraider-cli)" = /usr/bin/romraider-cli
              romraider-cli --version
            ' - "$UBUNTU" "$deb")
          echo "$version"
          test "$version" = "romraider-cli ${DIST_TAG#v}"

  # Collect every `release-*` artifact, checksum them, check their contents,
  # and publish. To add an artifact job: add its id to `needs` below.
  publish:
    name: publish
    needs: [plan, build-cli, build-appimage, test-appimage, build-deb, test-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
      DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      SHA: ${{ github.sha }}
    steps:
      # The content check below is this commit's xtask. Checked out before
      # the download, because checkout cleans the workspace.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets
        run: |
          rm -f SHA256SUMS
          files=(*)
          test "${#files[@]}" -gt 0
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      # Release artifact content check (US-RR-38-8): opens the tarball, the
      # .deb (control.tar and data.tar) and the AppImage's SquashFS payload
      # and fails the job, before anything below uploads (dry runs too), if
      # any entry is ROM-sized, has a ROM extension or a fixture / corpus
      # path, or is not on the release allow-list, or if assets/ holds a
      # file the check cannot open (rules: xtask/src/release_artifacts.rs).
      - name: Release artifact content check
        run: cargo run --locked --package xtask -- check-release-artifacts assets
      - name: Dry run (nothing published)
        if: needs.plan.outputs.publish != 'true'
        run: |
          echo "::notice::Dry run: would publish $RELEASE_TAG (prerelease=$PRERELEASE) with:"
          ls -l assets
      - name: Publish GitHub Release
        if: needs.plan.outputs.publish == 'true'
        run: |
          short=${SHA:0:12}
          if [ "$CHANNEL" = nightly ]; then
            title="Nightly $(date -u +%Y-%m-%d) ($short)"
          else
            title="RomRaider-RS $RELEASE_TAG"
          fi
          {
            echo "Built from commit $SHA (version ${DIST_TAG#v}) by the Release workflow."
            echo
            if [ "$CHANNEL" = nightly ]; then
              echo "Nightly build of the default branch: untested beyond CI, for opt-in testers. It is replaced by the next nightly."
              echo
            fi
            echo "Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > "$RUNNER_TEMP/notes.md"
          ls -l assets
          flags=(--title "$title" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if [ "$CHANNEL" = nightly ]; then
            flags+=(--target "$SHA")
            # Move the nightly: drop the previous release and its tag, then
            # recreate both at this commit.
            if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            fi
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG"
            fi
          else
            flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}" assets/*
