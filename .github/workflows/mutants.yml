# Mutation gate for RomRaider-RS (story US-RR-4, task US-RR-4-6;
# INFRASTRUCTURE.md "CI/CD Workflows", `mutants.yml`; PROJECT.md Testing
# Strategy T7; D-003).
#
# cargo-mutants changes the gated code (an operator, a return value) and runs
# the gated crate's tests against each change. A mutant the tests do not
# catch survives, and the gate is zero survivors: cargo-mutants exits 2 on a
# MISSED mutant and 3 on a TIMEOUT, failing the job. The gated modules, the
# exclusions (each with its justification) and the test runner are in
# .cargo/mutants.toml, which a local `cargo mutants` reads too.
#
# * Job `pr` (pull requests touching gated crates, test support or this
#   gate): `cargo mutants --in-diff pr.diff`, only the mutants in gated code
#   the pull request changes. When the diff touches test code that can kill
#   gated mutants (a weakened assertion changes no gated code, so --in-diff
#   would find nothing), `cargo xtask mutants-scope` answers `full` and the
#   job mutates every gated module instead (rules in
#   xtask/src/mutants_scope.rs).
# * Job `full` (weekly, and on demand): every gated module. Its report
#   (mutants.out: outcomes.json, missed.txt, caught.txt, logs) is uploaded as
#   artifact `mutants-report-full` (kept 90 days) whether or not the run
#   passes, so a survivor can be found from the run page.
# * Job `selftest` (both): `cargo xtask mutants-selftest` runs cargo-mutants
#   with .cargo/mutants.toml on scratch repositories and fails unless a
#   weakened test and an untested change in a gated module each leave a
#   survivor and exit 2 (xtask/src/mutants_selftest.rs).
#
# * Job `scope` (first): whether the event is in scope. A pull request is in
#   scope when it changes a path in the step's `paths` list (every crate
#   holding a gated module, the globs in .cargo/mutants.toml; each such
#   crate's tests; shared test support; the gate itself:
#   xtask/tests/mutants_ci_config.rs keeps the list in step); the schedule
#   and workflow_dispatch are always in scope (the full run). Out of scope,
#   `pr`, `full` and `selftest` are skipped.
# * Job `mutants-ok` (always runs): the required status check on
#   `rust-rewrite` (CONTRIBUTING.md "Branch protection"). It fails if
#   `scope` did not succeed, if any gate job failed or was cancelled, or if
#   a gate job that should have run for an in-scope event was skipped; it
#   passes when the change is out of scope. The workflow has no trigger-level
#   `paths:` filter, so it starts on every pull request and the check never
#   sits at "Expected".
#
# GitHub fires `schedule` only for the workflow file on the repository's
# default branch, and runs it on that branch's latest commit; it accepts
# `workflow_dispatch` only for a workflow that exists on the default branch.
# While the default branch is `master` and this file lives only on
# `rust-rewrite`, the weekly run never fires and cannot be started by hand.
# To get the weekly report, a maintainer either makes `rust-rewrite` the
# default branch, or merges `rust-rewrite` (with this file) into `master`.
# Copying only this file to `master` registers it, so `gh workflow run
# mutants.yml --ref rust-rewrite` works, but the schedule would then mutate
# `master`'s tree.

name: Mutants

on:
  # No `paths:` filter: job `scope` decides, so `mutants-ok` reports on
  # every pull request.
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly full run: Mondays 03:17 UTC. Fires only from the default branch
    # (see the header).
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  INSTA_UPDATE: "no"

defaults:
  run:
    shell: bash

jobs:
  # Is this event in scope? A pull request is when it changes a path below;
  # the schedule and workflow_dispatch (the full run) always are. The other
  # jobs run only in scope; `mutants-ok` reports either way.
  scope:
    name: mutants-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      in_scope: ${{ steps.scope.outputs.in_scope }}
    steps:
      # Full history (commits and trees; file contents are not needed for
      # a list of changed paths), so the PR's base is present.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      # A failing git command (a missing base) fails this job, and
      # `mutants-ok` with it: never a silent "out of scope".
      - name: Changed paths in scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Git glob pathspecs. Every crate holding a gated module (the
          # globs in .cargo/mutants.toml), shared test support and fixtures,
          # and the gate: xtask/tests/mutants_ci_config.rs checks this list
          # against .cargo/mutants.toml and xtask/src/mutants_scope.rs.
          paths=(
            "crates/rr-core/**"
            "crates/rr-rom/**"
            "crates/rr-comms/**"
            "crates/rr-testkit/**"
            "fixtures/**"
            ".cargo/mutants.toml"
            ".github/workflows/mutants.yml"
            "xtask/src/mutants_scope.rs"
            "xtask/src/mutants_selftest.rs"
            "rust-toolchain.toml"
          )
          if [ "$EVENT" != pull_request ]; then
            echo "$EVENT: the full run is always in scope"
            in_scope=true
          else
            if [ -z "$BASE" ]; then
              echo "::error::no pull request base commit"
              exit 1
            fi
            changed=$(git --glob-pathspecs diff --name-only --no-renames "$BASE"...HEAD -- "${paths[@]}")
            if [ -n "$changed" ]; then
              echo "Changed paths in scope:"
              echo "$changed"
              in_scope=true
            else
              echo "No change under the gate's paths: the gate jobs are skipped"
              in_scope=false
            fi
          fi
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"

  # Mutants in the gated code a pull request changes (or every gated module
  # when it changes their tests).
  pr:
    name: mutants (pull request)
    needs: scope
    if: needs.scope.outputs.in_scope == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Full history, so the diff against the base can be written.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Toolchain comes from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      # The diff from the merge-base of the PR's base commit and the checked
      # out merge commit: exactly the pull request's change, with new-side
      # line numbers matching the tree under test.
      - name: Write the pull request diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --no-color --no-ext-diff "$PR_BASE_SHA"...HEAD > pr.diff
      # `diff`: mutants in changed gated code only (none when no gated code
      # changed: exit 0). `full`: every gated module (reasons in the log).
      - name: cargo mutants
        run: |
          scope=$(cargo xtask mutants-scope --diff pr.diff)
          echo "Mutation scope: $scope"
          if [ "$scope" = full ]; then
            cargo mutants --jobs 2 --output .
          else
            cargo mutants --jobs 2 --output . --in-diff pr.diff
          fi
      # mutants.out does not exist when no mutant matched (nothing to report).
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-pr
          path: mutants.out
          if-no-files-found: warn
          retention-days: 14

  # Every gated module, weekly; the report is the artifact.
  full:
    name: mutants (full)
    needs: scope
    if: needs.scope.outputs.in_scope == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      - name: cargo mutants
        run: cargo mutants --jobs 2 --output .
      # Uploaded on failure too: the report is how a survivor is found.
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-full
          path: mutants.out
          if-no-files-found: error
          retention-days: 90

  # The gate fails on a weakened test and on untested changed code, with this
  # repository's .cargo/mutants.toml.
  selftest:
    name: mutants-selftest
    needs: scope
    if: needs.scope.outputs.in_scope == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-mutants
      - name: cargo xtask mutants-selftest
        run: cargo xtask mutants-selftest

  # The required status check (CONTRIBUTING.md "Branch protection"). Runs
  # even when a needed job failed (`if: always()`; a skipped required check
  # counts as passed). Fails when `scope` did not succeed or gave no answer,
  # when a gate job failed or was cancelled, or when a gate job that should
  # have run for this in-scope event was skipped. Out of scope, every gate
  # job is skipped and this passes. Same idiom as `ci-ok` in ci.yml, except
  # that a skip is allowed when the event is out of scope.
  mutants-ok:
    name: mutants-ok
    if: always()
    needs: [scope, pr, full, selftest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate results
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.scope.result }}
          IN_SCOPE: ${{ needs.scope.outputs.in_scope }}
          PR: ${{ needs.pr.result }}
          FULL: ${{ needs.full.result }}
          SELFTEST: ${{ needs.selftest.result }}
        run: |
          echo "event: $EVENT; scope: $SCOPE (in_scope: ${IN_SCOPE:-none})"
          echo "pr: $PR; full: $FULL; selftest: $SELFTEST"
          if [ "$SCOPE" != success ]; then
            echo "::error::job scope did not succeed ($SCOPE)"
            exit 1
          fi
          case "$IN_SCOPE" in
            true | false) ;;
            *)
              echo "::error::job scope gave no in_scope answer ('$IN_SCOPE')"
              exit 1
              ;;
          esac
          # Which jobs must have run: `pr` on a pull request, `full` on any
          # other event, `selftest` on both; none out of scope.
          pr_runs=false
          full_runs=false
          if [ "$EVENT" = pull_request ]; then pr_runs=$IN_SCOPE; else full_runs=$IN_SCOPE; fi
          failed=false
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" = true ]; then
                  echo "::error::job $1 was skipped, but this event is in scope"
                  failed=true
                fi
                ;;
              *)
                echo "::error::job $1: $2"
                failed=true
                ;;
            esac
          }
          check pr "$PR" "$pr_runs"
          check full "$FULL" "$full_runs"
          check selftest "$SELFTEST" "$IN_SCOPE"
          if [ "$failed" != false ]; then
            exit 1
          fi
          echo "Mutation gate passed (in scope: $IN_SCOPE)."
