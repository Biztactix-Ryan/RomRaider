# CI gates for RomRaider-RS (story US-RR-2, INFRASTRUCTURE.md "Build Pipeline", D-016).
#
# Branch protection should require only the aggregate `ci-ok` check.
# To add a gate: append a job below with a stable `name:` and add its
# job id to `ci-ok.needs`. Nothing else needs to change.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  # release.yml runs this whole workflow as its `ci` job, so nothing is
  # released unless every gate here (t6 and ci-ok included) passed on the
  # commit being released.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # insta never writes .snap.new / .pending-snap in CI: a mismatching snapshot
  # fails the assertion on every job and target. (GitHub also sets CI=true,
  # which insta treats the same way; this makes it explicit.)
  INSTA_UPDATE: "no"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Toolchain (1.97.1 + rustfmt/clippy) comes from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # Lint job: clippy with warnings denied, plus the architecture dependency-rule check.
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo xtask check-deps
        run: cargo xtask check-deps
      - name: cargo xtask check-globals
        run: cargo xtask check-globals
      # No code reachable from rr-testkit::reference (the independent reference
      # codec) may name rr-core or any workspace crate (US-RR-10-8; rules in
      # xtask/src/reference_isolation.rs). Also a nextest test in every `test` job.
      - name: cargo xtask check-reference-isolation
        run: cargo xtask check-reference-isolation
      # Every exclusion in .cargo/mutants.toml (exclude_globs / exclude_re /
      # skip_calls) needs a non-trivial justification comment directly above
      # it, and no source under crates/ may use `mutants::skip` (US-RR-4-7,
      # US-RR-4-3; rules in xtask/src/mutants_exclusions.rs). Here, not in
      # mutants.yml, so it runs on every push and pull request.
      - name: cargo xtask check-mutants-exclusions
        run: cargo xtask check-mutants-exclusions
      # Runs clippy on generated planted violations (target/lint-selftest)
      # with this workspace's lints + clippy.toml; fails unless every safety
      # lint fires exactly where planted (US-RR-3-1, US-RR-3-2, US-RR-18-4).
      - name: cargo xtask lint-selftest
        run: cargo xtask lint-selftest
      # Runs nextest (own target dir, target/fixtures-selftest) with
      # RR_CORPUS_DIR / RR_FIXTURES_DIR removed, with default features and with
      # --features private-fixtures; fails unless every corpus/private-tier
      # test is reported SKIP (named after the variable to set), never PASS,
      # and fails when forced with --run-ignored (US-RR-6-1). Then, with
      # --features private-fixtures and RR_FIXTURES_DIR at a scratch temp dir
      # holding a planted nonce, the private sentinel tests must PASS, and
      # FAIL when given a different nonce, proving they really run against
      # the directory (US-RR-13-3). Here rather than in `test` because the
      # behaviour is target-independent.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo xtask fixtures-selftest
        run: cargo xtask fixtures-selftest

  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # Native GitHub-hosted arm64 runner. If it is unavailable for this
          # repository, switch to ubuntu-24.04 + cross for this entry.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # 32-bit build, run natively on the x64 Windows runner (WoW64).
          # Many vendor J2534 DLLs are 32-bit only. The windows-2022 image's
          # MSVC install includes the x86 toolset and libs, and nextest runs
          # the i686 test binaries directly (no target runner needed).
          - target: i686-pc-windows-msvc
            os: windows-2022
    env:
      # Compiler warnings fail the build on every target, including
      # cfg(windows)/cfg(target_arch) code that the Linux clippy job never sees.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Clippy per target: a clippy warning in cfg(windows) / cfg(target_arch)
      # code fails on the target that compiles it, not only on Linux.
      - name: cargo clippy (target)
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --locked --target ${{ matrix.target }}
      - name: doctests
        run: cargo test --doc --workspace --locked --target ${{ matrix.target }}
      # Runs `cargo fmt --all --check` and this job's clippy and nextest
      # commands on generated scratch crates (target/gates-selftest); fails
      # unless a rustfmt violation, a clippy warning and a failing test each
      # fail their gate on this target and a clean control passes (US-RR-2-1).
      - name: cargo xtask gates-selftest
        run: cargo xtask gates-selftest --target ${{ matrix.target }}

  # Supply-chain gate: licences (GPL-2.0-or-later compatible, D-016), RustSec
  # advisories, bans and sources, per deny.toml.
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      # Pinned to the version deny.toml's schema was written against.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked check
      # Runs the same command on generated scratch workspaces
      # (target/deny-selftest) with this deny.toml; fails unless an
      # SSPL-licensed dependency and one with an open RustSec advisory are
      # both rejected and a clean control passes (US-RR-2-2).
      - name: cargo xtask deny-selftest
        run: cargo xtask deny-selftest

  # T6 safety-invariant suite (PROJECT.md Testing Strategy: must pass,
  # release-blocking; story US-RR-7). Release-blocking: release.yml must not
  # build or publish unless this job passed. It runs this workflow as its `ci`
  # job (`workflow_call`) and every build job `needs:` that job
  # (xtask/tests/t6_ci_config.rs).
  #
  # Selection convention (CONTRIBUTING.md, Safety review process): T6 tests
  # live in test binaries named `t6_*.rs` or in test functions/modules named
  # `t6_*`; the rr-core capability-token unit tests (`capability::tests`) are
  # included by path. `--no-tests=fail` makes an empty selection a failure.
  t6:
    name: T6 safety invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo xtask check-writes
        run: cargo xtask check-writes
      - name: T6 tests (cargo nextest)
        run: >-
          cargo nextest run --workspace --locked --no-tests=fail
          -E 'binary(/^t6_/) | test(/(^|::)t6_/) | (package(rr-core) & test(/^capability::/))'
      - name: T6 capability tests with minting authority (cargo nextest)
        run: >-
          cargo nextest run -p rr-core --features confirmation-authority --locked
          -E 'test(/^capability::/)'

  # Pending-snapshot gate (story US-RR-2). Two failure modes, two checks:
  #  1. Committed pending files. insta deletes a stale *.snap.new when its
  #     assertion passes, at the start of `cargo insta test` and even under
  #     plain nextest, so a check run *after* the tests would never see one a
  #     PR committed. Hence `git ls-files` on the fresh checkout, before any
  #     test runs.
  #  2. Snapshot drift. `cargo insta test --check` with INSTA_UPDATE=no fails
  #     on any mismatching snapshot without writing anything, and
  #     `--unreferenced=reject` fails on a committed .snap that no test
  #     asserts any more (a renamed or deleted test leaves a stale golden that
  #     reviewers would otherwise trust). Caveat: a snapshot test that is
  #     #[ignore]d here (e.g. corpus-gated) or cfg'd off on Linux would count
  #     as unreferenced; such snapshots need this job extended, not the flag
  #     dropped. The final step is a belt-and-braces check that the run left
  #     no pending files behind.
  # The test matrix also fails on snapshot mismatches on every target via the
  # workflow-level INSTA_UPDATE=no; this job adds the two checks it cannot do.
  snapshots:
    name: snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - name: No pending snapshots committed
        run: |
          pending=$(git ls-files -- '*.snap.new' '*.pending-snap')
          if [ -n "$pending" ]; then
            echo "::error::Pending insta snapshots are committed; review them with 'cargo insta review' and commit the .snap files instead:"
            echo "$pending"
            exit 1
          fi
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-insta
      # `cargo insta test` cannot pass --locked through to cargo when running
      # under nextest, so enforce the lockfile here.
      - name: cargo fetch --locked
        run: cargo fetch --locked
      # Doctests are already run per target by the test job.
      - name: cargo insta test --check
        run: >-
          cargo insta test --workspace --check --unreferenced=reject
          --test-runner nextest --disable-nextest-doctest
      - name: No pending snapshots left behind
        if: always()
        run: |
          left=$(find . -path ./target -prune -o \( -name '*.snap.new' -o -name '*.pending-snap' \) -print)
          if [ -n "$left" ]; then
            echo "::error::The test run left pending insta snapshots:"
            echo "$left"
            exit 1
          fi

  # Aggregate gate: the single required status check for branch protection.
  # Add every new job id to `needs`.
  # RealClock under an OS wall-clock step (story US-RR-18-3, EC-26).
  # libfaketime steps CLOCK_REALTIME for the test process only, mid-run, by
  # rewriting its timestamp file; FAKETIME_DONT_FAKE_MONOTONIC=1 leaves
  # CLOCK_MONOTONIC real, exactly as an NTP/user clock step does. No root, and
  # no other process on the runner is touched. The preload goes on the test
  # binary alone: cargo hangs under libfaketime. The test is #[ignore]d
  # everywhere else (crates/rr-core/tests/realclock_wall_step.rs).
  faketime:
    name: RealClock wall-clock step (libfaketime)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - name: Install libfaketime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfaketime
      - name: Build the wall-step test
        id: build
        run: |
          bin=$(cargo test -p rr-core --test realclock_wall_step --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "realclock_wall_step") | .executable')
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: RealClock under wall-clock steps
        run: |
          ts="$RUNNER_TEMP/faketime"
          echo +0 > "$ts"
          LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 \
            FAKETIME_DONT_FAKE_MONOTONIC=1 FAKETIME_NO_CACHE=1 \
            FAKETIME_TIMESTAMP_FILE="$ts" RR_FAKETIME_FILE="$ts" \
            "${{ steps.build.outputs.bin }}" --ignored --exact real_clock_mono_never_follows_os_wall_clock_steps \
            | tee "$RUNNER_TEMP/faketime.out"
          # An --exact filter that matches nothing still exits 0: demand the run.
          grep -q '^test result: ok. 1 passed' "$RUNNER_TEMP/faketime.out"

  # Committed fuzz crash inputs as ordinary regression tests (story US-RR-5,
  # task US-RR-5-7; docs/fuzzing.md "When the fuzzer finds a bug"). Stable
  # toolchain from rust-toolchain.toml: no nightly, no cargo-fuzz, no
  # libFuzzer. `cargo xtask fuzz replay` is `cargo test --manifest-path
  # fuzz/Cargo.toml --locked`: the seeds, then fuzz/tests/regressions.rs,
  # which first proves the replay fails on a planted panic, a planted hang
  # (killed at the timeout) and planted runaway memory, then replays every
  # file in fuzz/regressions/<target>/ through rr_fuzz::TARGETS, each in its
  # own child process under the per-input timeout and memory caps from
  # fuzz/Cargo.toml. A directory for an unknown target fails the job; a
  # target with no directory has nothing to replay. Wiring is checked by
  # xtask/tests/fuzz_replay_ci_config.rs.
  fuzz-regressions:
    name: fuzz regressions (stable replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-regressions
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - name: cargo xtask fuzz replay
        run: cargo xtask fuzz replay

  # ROM-leak guard (story US-RR-13, task US-RR-13-6; SECURITY.md
  # "Proprietary firmware" and "PII Handling", D-017; rules in
  # xtask/src/leak_guard.rs). The same check as hooks/pre-commit, here so a
  # commit made without the hook (not installed, or --no-verify) still
  # fails `ci-ok`. First every file under fixtures/public, with every rule:
  # over 64 KiB, a corpus manifest SHA-256, a known ROM ID, a ROM-ID-shaped
  # string at a ROM ID address in a binary, an unscrubbed 17-character VIN,
  # a symlink. Then every tracked file (NUL-separated, so any file name is
  # safe): the stock-ROM hashes anywhere in the repo, and fixtures/public's
  # rules again for the tracked files there. Exit 1 on a finding, 2 on a
  # read error; both fail the step. Wiring is checked by
  # xtask/tests/leak_guard_ci_config.rs.
  leak-guard:
    name: ROM-leak guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: leak-guard
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - name: cargo xtask leak-guard (fixtures/public)
        run: cargo xtask leak-guard
      - name: cargo xtask leak-guard (every tracked file)
        run: git ls-files -z | xargs -0 cargo xtask leak-guard --

  # External stock-ROM corpus (story US-RR-11, task US-RR-11-8; D-025;
  # INFRASTRUCTURE.md "Stock-ROM corpus in CI"). `cargo xtask fetch-corpus`
  # downloads the ~500 images from the public upstream at the manifest's
  # pinned commit (no secrets, so fork pull requests work) and verifies every
  # size and SHA-256 against fixtures/corpus-manifest.toml.
  #
  # RR_CORPUS_DIR is the developer default, $HOME/.cache/romraider-rs/corpus:
  # outside the workspace (fetch-corpus refuses a directory inside the repo),
  # identical to a local run, and on a persistent self-hosted runner it keeps
  # a warm corpus between jobs even without the cache (runner.temp is wiped).
  #
  # The cache key is the manifest's hash: a new manifest is a new corpus, and
  # nothing else changes it. No restore-keys: a corpus for another manifest
  # never verifies, so fetch-corpus would refetch it all anyway. On a hit,
  # fetch-corpus verifies the restored tree and fetches nothing; a tree that
  # does not verify is refetched. A miss is saved right after the verified
  # fetch (not at job end, so a later failing step still leaves a warm cache),
  # and never on a hit, so a cache entry only ever holds a verified corpus.
  # ~411 MB on disk, far below the 10 GB repository cache limit.
  #
  # Time budget: a cold fetch (cache miss) must finish within 5 minutes, the
  # fetch step's timeout-minutes, which BUDGET_SECONDS repeats for the log
  # (xtask/tests/corpus_ci_config.rs keeps them equal). The step logs the
  # elapsed time, the cache hit and whether it fetched to the job log and the
  # step summary. The corpus-tier tests (US-RR-11-1, US-RR-11-2) belong in
  # this job, after the fetch, with RR_CORPUS_DIR set; the job runs only on
  # Linux, as those tests are target-independent.
  #
  # US-RR-11-1: after the cache is saved, `--verify-only` must report all
  # CORPUS_IMAGES (501, D-025; spelled out here so a truncated manifest
  # cannot pass) at their manifest size and SHA-256, and every corpus-tier
  # test (`*::requires_RR_CORPUS_DIR`) runs against the fetched corpus. They
  # can never be skipped here: RR_CORPUS_DIR is set, so they are built as
  # plain tests, and `--run-ignored all` would force-run (and so fail, via
  # require_tier / NotFetched) any that were not; `--no-tests=fail` fails an
  # empty filter.
  #
  # US-RR-16-6: then `cargo xtask gen-corpus-coverage --check` fails unless
  # the committed coverage report is byte-identical to one generated from
  # the fetched corpus and definitions.
  corpus:
    name: stock-ROM corpus (fetch-corpus)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      # Built before the timed step, so its time is the fetch, not the build.
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Corpus directory
        run: echo "RR_CORPUS_DIR=$HOME/.cache/romraider-rs/corpus" >> "$GITHUB_ENV"
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RR_CORPUS_DIR }}
          key: rr-corpus-v1-${{ runner.os }}-${{ hashFiles('fixtures/corpus-manifest.toml') }}
      - name: cargo xtask fetch-corpus
        id: fetch
        timeout-minutes: 5
        env:
          CACHE_HIT: ${{ steps.corpus-cache.outputs.cache-hit }}
          BUDGET_SECONDS: "300"
        run: |
          log="$RUNNER_TEMP/fetch-corpus.log"
          start=${EPOCHREALTIME/[.,]/}
          cargo xtask fetch-corpus 2>&1 | tee "$log"
          ms=$(( (${EPOCHREALTIME/[.,]/} - start) / 1000 ))
          secs=$(printf '%d.%03d' $((ms / 1000)) $((ms % 1000)))
          hit=false
          if [ "$CACHE_HIT" = true ]; then hit=true; fi
          if grep -q '^fetch-corpus: ok: fetched ' "$log"; then
            fetch=cold
            if [ "$hit" = true ]; then fetch="cold (restored cache did not verify)"; fi
          elif grep -q '^fetch-corpus: ok: .*; nothing fetched$' "$log"; then
            fetch="warm (verified, nothing fetched)"
          else
            echo "::error::fetch-corpus printed no ok line"
            exit 1
          fi
          line="cache-hit=$hit; fetch: $fetch; ${secs}s (budget ${BUDGET_SECONDS}s)"
          echo "::notice title=stock-ROM corpus::$line"
          {
            echo "### Stock-ROM corpus"
            echo
            echo "| cache hit | fetch | elapsed | budget |"
            echo "|---|---|---|---|"
            echo "| $hit | $fetch | ${secs}s | ${BUDGET_SECONDS}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "cache-hit=$hit"
            echo "fetch=${fetch%% *}"
            echo "seconds=$secs"
          } >> "$GITHUB_OUTPUT"
          if [ "$ms" -gt $((BUDGET_SECONDS * 1000)) ]; then
            echo "::error::fetch-corpus took ${secs}s, over the ${BUDGET_SECONDS}s budget"
            exit 1
          fi
      - name: Save corpus cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RR_CORPUS_DIR }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}
      - name: Verify all corpus images
        env:
          CORPUS_IMAGES: "501"
        run: |
          log="$RUNNER_TEMP/verify-corpus.log"
          cargo xtask fetch-corpus --verify-only 2>&1 | tee "$log"
          if ! grep -q "^fetch-corpus: ok: ${CORPUS_IMAGES}/${CORPUS_IMAGES} image(s), " "$log"; then
            echo "::error::the corpus did not verify as ${CORPUS_IMAGES}/${CORPUS_IMAGES} images"
            exit 1
          fi
      # US-RR-16-6: fixtures/corpus-coverage.toml (every corpus image with
      # the pinned ECU definitions matching its bytes, or "no definition";
      # D-028) must be exactly what this fetched corpus gives. Plain --check:
      # it reads RR_CORPUS_DIR and the committed manifest, hash-checks every
      # file it reads, and writes nothing.
      - name: Corpus coverage report
        run: cargo xtask gen-corpus-coverage --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Corpus-tier tests (cargo nextest)
        run: cargo nextest run --workspace --locked --run-ignored all --no-tests=fail -E 'test(/::requires_RR_CORPUS_DIR$/)'

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, deny, t6, snapshots, faketime, corpus, leak-guard, fuzz-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All gates passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: echo "All CI gates passed."
      - name: A gate failed, was cancelled, or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "needs results: ${{ join(needs.*.result, ', ') }}"
          exit 1
