# Known-answer fixture checks for RomRaider-RS (story US-RR-9, task US-RR-9-7;
# INFRASTRUCTURE.md "CI/CD Workflows", `fixtures.yml`).
#
# Runs `cargo xtask validate-fixtures` (rules in
# crates/rr-testkit/src/kat/validate.rs) on every KAT fixture, and
# `cargo xtask gen-synthetic --check` on Linux and Windows (US-RR-10-7),
# when a push or pull request touches the fixtures, rr-testkit, or the xtask
# wiring.
#
# There is no trigger-level `paths:` filter: the workflow starts on every
# push and pull request, and job `scope` decides whether the event is in
# scope (it changes a path in the step's `paths` list; checked by
# xtask/tests/fixtures_ci_config.rs). Out of scope, `validate` and
# `synthetic` are skipped. Job `fixtures-ok` always runs and is the required
# status check on `rust-rewrite` (CONTRIBUTING.md "Branch protection"): it
# fails if `scope` did not succeed, if a fixture job failed or was cancelled,
# or if one was skipped although the event is in scope, and passes when the
# event is out of scope.

name: Fixtures

on:
  # No `paths:` filter: job `scope` decides, so `fixtures-ok` reports on
  # every push and pull request.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  # Is this event in scope? A pull request is when it changes a path below
  # (against its base); a push is when it changes one since the commit
  # before the push, and always when that commit is not an ancestor of the
  # pushed head (a new branch, a force push); workflow_dispatch always is.
  # The fixture jobs run only in scope; `fixtures-ok` reports either way.
  scope:
    name: fixtures-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      in_scope: ${{ steps.scope.outputs.in_scope }}
    steps:
      # Full history (commits and trees; file contents are not needed for
      # a list of changed paths), so the base is present.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      # A failing git command (a missing pull request base) fails this job,
      # and `fixtures-ok` with it: never a silent "out of scope".
      - name: Changed paths in scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Git glob pathspecs, checked by xtask/tests/fixtures_ci_config.rs.
          # The validator is started by `cargo xtask validate-fixtures`
          # (xtask/src/validate_fixtures.rs, dispatched from
          # xtask/src/main.rs), hence all of xtask/.
          paths=(
            "fixtures/**"
            "crates/rr-testkit/**"
            "xtask/**"
            ".cargo/config.toml"
            "Cargo.toml"
            "Cargo.lock"
            "rust-toolchain.toml"
            ".gitattributes"
            ".github/workflows/fixtures.yml"
          )
          range=
          if [ "$EVENT" = pull_request ]; then
            if [ -z "$BASE" ]; then
              echo "::error::no pull request base commit"
              exit 1
            fi
            range="$BASE...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] \
              && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          if [ -z "$range" ]; then
            echo "$EVENT (before: ${BEFORE:-none}): no base to compare with, in scope"
            in_scope=true
          else
            changed=$(git --glob-pathspecs diff --name-only --no-renames "$range" -- "${paths[@]}")
            if [ -n "$changed" ]; then
              echo "Changed paths in scope ($range):"
              echo "$changed"
              in_scope=true
            else
              echo "No change under the fixture paths ($range): the fixture jobs are skipped"
              in_scope=false
            fi
          fi
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"

  # KAT schema validation; every expected value has a source; a hand-calc
  # source shows its working; a changed expected value needs a new
  # [[changelog]] line in the fixture (US-RR-9 acceptance criteria).
  validate:
    name: KAT fixtures (validate-fixtures)
    needs: scope
    if: needs.scope.outputs.in_scope == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history: `--base` compares each fixture with its version at the
      # merge-base of the base revision and HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Toolchain comes from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      # No paths: the validator's defaults, fixtures/kat and
      # crates/rr-testkit/tests/data/kat, i.e. every fixture.
      - name: cargo xtask validate-fixtures
        run: cargo xtask validate-fixtures
      # Base mode: a fixture whose expected values differ from the base
      # version must add a [[changelog]] entry saying why
      # (`changed-without-changelog`). On a pull request the base is the PR's
      # base commit. On a push (and workflow_dispatch) `--push-before` picks
      # it (GitBase::for_push in crates/rr-testkit/src/kat/validate.rs): the
      # commit before the push when it exists; otherwise (a new branch, whose
      # `before` is all zeros, or a force push whose old head is gone) the
      # point where HEAD leaves every other remote branch, so the pushed
      # commits are still checked. (The default branch, master, has no
      # fixtures, so comparing with it would check nothing.) A bad base
      # exits 2 and fails the job.
      - name: cargo xtask validate-fixtures --base (changed expected values need a changelog line)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE_SHA"
            echo "Comparing fixtures with the pull request's base $base"
            cargo xtask validate-fixtures --base "$base"
          else
            echo "Comparing fixtures with the push's base (before: ${BEFORE:-none})"
            cargo xtask validate-fixtures --push-before="$BEFORE"
          fi

  # Synthetic ROMs regenerate byte-identically on every platform (US-RR-10,
  # task US-RR-10-7). `cargo xtask gen-synthetic --check` regenerates every
  # published plan (rr_testkit::reference::synthetic) into a scratch
  # directory and fails on any byte difference from fixtures/public/synthetic
  # (ROM images, manifests and SHA256SUMS). `sha256sum -c` then checks the
  # checked-out bytes against the committed hashes with a tool that shares no
  # code with the generator. Both run on Linux and Windows (where a CRLF
  # checkout or platform-dependent float handling would show up); the
  # directory's .gitattributes keeps git from rewriting the bytes.
  synthetic:
    name: Synthetic ROMs (gen-synthetic --check, ${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.in_scope == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both platforms even when one differs.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v5
      # Toolchain comes from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --no-self-update && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: synthetic-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-rewrite' }}
      - name: cargo xtask gen-synthetic --check
        run: cargo xtask gen-synthetic --check
      - name: sha256sum -c SHA256SUMS (committed bytes match the committed hashes)
        working-directory: fixtures/public/synthetic
        run: sha256sum -c SHA256SUMS

  # PLACEHOLDER (story US-RR-13, not implemented yet): ROM-leak guard. Add a
  # job here that fails when a real (non-synthetic) ROM image is committed,
  # add it to `fixtures-ok`'s `needs` and check its result there.

  # The required status check (CONTRIBUTING.md "Branch protection"). Runs
  # even when a needed job failed (`if: always()`; a skipped required check
  # counts as passed). Fails when `scope` did not succeed or gave no answer,
  # when a fixture job failed or was cancelled, or when one was skipped
  # although the event is in scope. Out of scope, both fixture jobs are
  # skipped and this passes. Same idiom as `ci-ok` in ci.yml, except that a
  # skip is allowed when the event is out of scope.
  fixtures-ok:
    name: fixtures-ok
    if: always()
    needs: [scope, validate, synthetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fixture job results
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.scope.result }}
          IN_SCOPE: ${{ needs.scope.outputs.in_scope }}
          VALIDATE: ${{ needs.validate.result }}
          SYNTHETIC: ${{ needs.synthetic.result }}
        run: |
          echo "event: $EVENT; scope: $SCOPE (in_scope: ${IN_SCOPE:-none})"
          echo "validate: $VALIDATE; synthetic: $SYNTHETIC"
          if [ "$SCOPE" != success ]; then
            echo "::error::job scope did not succeed ($SCOPE)"
            exit 1
          fi
          case "$IN_SCOPE" in
            true | false) ;;
            *)
              echo "::error::job scope gave no in_scope answer ('$IN_SCOPE')"
              exit 1
              ;;
          esac
          failed=false
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" = true ]; then
                  echo "::error::job $1 was skipped, but this event is in scope"
                  failed=true
                fi
                ;;
              *)
                echo "::error::job $1: $2"
                failed=true
                ;;
            esac
          }
          check validate "$VALIDATE" "$IN_SCOPE"
          check synthetic "$SYNTHETIC" "$IN_SCOPE"
          if [ "$failed" != false ]; then
            exit 1
          fi
          echo "Fixture checks passed (in scope: $IN_SCOPE)."
