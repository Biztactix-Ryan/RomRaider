schema = 1
title = "2D tables: a Y Axis read from the image, a Static X Axis, and <memmodel endian> overriding the table's byte order"
notes = """
The ROM's <memmodel endian="little"> overrides every table's and axis's
byte order, the table's own endian="big" included (legacy
TableScaleUnmarshaller:162-169): the merged document keeps the attribute
as written (big), the resolved encoding is little. `Gear Ratio Target`
has a Static X Axis: its <data> values as written, no cells to decode, and
a sizex / flipx that are its one data size and flip (legacy :185-188).
The document also keeps sizex and flipx as written in size_x and flip_x,
on every kind of table (the TableDoc docs, "Per-element fields legacy read
twice"); only a 3D table uses them.
"""
resolve = "KAT2D"
xml = '''
<roms>
  <rom>
    <romid><xmlid>KAT2D</xmlid><memmodel endian="little">SH7055</memmodel></romid>
    <table type="2D" name="Injector Latency" category="Fueling" storageaddress="2F5C0" storagetype="int16" endian="big" sizey="8" userlevel="1">
      <scaling units="ms" expression="x*0.004" to_byte="x/0.004" format="0.000"/>
      <table type="Y Axis" name="Battery Voltage" storageaddress="2F5A0" storagetype="uint16" logparam="P17">
        <scaling units="V" expression="x/100" to_byte="x*100" format="0.00"/>
      </table>
    </table>
    <table type="2D" name="Gear Ratio Target" storageaddress="30000" storagetype="float" sizex="3" flipx="true">
      <table type="Static X Axis" name="Gear" sizex="3">
        <data>1</data>
        <data>2</data>
        <data>3</data>
      </table>
    </table>
  </rom>
</roms>
'''

[[table]]
name = "Injector Latency"
kind = "2D"
at = "4:5"
layer = "KAT2D"
category = "Fueling"
user_level = 1
size_y = 8

[table.cells]
storage_address = 0x2F5C0
storage = "i16"
endian = "big"
size = 8

[table.cells.scaling.default]
units = "ms"
expression = "x*0.004"
to_byte = "x/0.004"
format = "0.000"

[table.encoding]
storage = "i16"
endian = "little"
layout = "default"
working = "int16 = i16 (2 bytes, signed); <memmodel endian=little> overrides the table's endian=big, so endian = little; no mask, no dataLayout = default"

[table.conversion]
form = "expr"
to_raw = true
unit = "ms"
format = "0.000"
working = "expression x*0.004 = to_real, to_byte x/0.004 = to_raw; units ms, format 0.000"

[[table.cell]]
hex = "E8 03"
real = 4.0
working = "little-endian 0x03E8 = 3*256 + 232 = 1000; 1000*0.004 = 4.0 (big-endian would be 0xE803 = 59395 - 65536 = -6141)"

[[table.cell]]
hex = "18 FC"
real = -4.0
working = "little-endian 0xFC18 = 252*256 + 24 = 64536; top bit set, 64536 - 65536 = -1000; -1000*0.004 = -4.0"

[[table.axis]]
name = "Battery Voltage"
log_param = "P17"

[table.axis.cells]
storage_address = 0x2F5A0
storage = "u16"

[table.axis.cells.scaling.default]
units = "V"
expression = "x/100"
to_byte = "x*100"
format = "0.00"

[table.axis.encoding]
storage = "u16"
endian = "little"
layout = "default"
working = "uint16 = u16; the axis has no endian, and <memmodel endian=little> = little; no mask = no bitfield, layout default"

[table.axis.conversion]
form = "expr"
to_raw = true
unit = "V"
format = "0.00"
working = "expression x/100 = to_real, to_byte x*100 = to_raw; units V, format 0.00"

[[table.axis.cell]]
hex = "B0 04"
real = 12.0
working = "little-endian 0x04B0 = 4*256 + 176 = 1200; 1200/100 = 12.0"

[[table]]
name = "Gear Ratio Target"
kind = "2D"
at = "10:5"
layer = "KAT2D"
size_x = 3
flip_x = true

[table.cells]
storage_address = 0x30000
storage = "f32"
size = 3
flip = true

[table.encoding]
storage = "f32"
endian = "little"
layout = "default"
working = "storagetype float = f32 (4 bytes); no endian attribute, <memmodel endian=little> = little; layout default"

[table.conversion]
form = "linear"
m = 1.0
b = 0.0
working = "no <scaling> = raw values: real = 1*x + 0"

[[table.cell]]
hex = "00 00 C0 3F"
real = 1.5
working = "little-endian bits 0x3FC00000: sign 0, exponent 0x7F = 127, so 2^(127-127) = 1; fraction 0x400000 / 2^23 = 0.5; 1 * (1 + 0.5) = 1.5"

[[table.axis]]
name = "Gear"

[table.axis.cells]
size = 3
static_values = ["1", "2", "3"]
