# Formulas of the pinned definition corpus, hand-checked (US-RR-20-10).
#
# Every value was derived by hand from the formula, read from the fetched corpus at
# `path` / `xpath`, with the case's `x` and `params` substituted (the `working`). They
# were cross-checked independently with Python (each formula rewritten as a Python
# expression, math.fmod for %, IEEE division by zero), never with rr-core or rr-testkit
# code and never with Java (D-024). An exact case is exact because every step is exact
# in binary floating point (a scale that is a binary fraction such as 45/128, or an
# integer result); every other case has a tolerance.
#
# Consumed by crates/rr-testkit/tests/expr_kat.rs: `corpus_formula_cases_match_rr_core`
# (corpus tier, RR_CORPUS_DIR) harvests the corpus, finds each formula by its SHA-256,
# checks that it occurs at `path` / `xpath`, parses it with rr_core::expr::parse and
# evaluates it; `corpus_fixture_names_its_formulas_by_hash_only` checks this file
# without the corpus.
schema = 1
title = "Formulas harvested from the pinned ECU and v290 logger definitions: hand-checked known answers"
notes = """
WHAT THIS PINS. RomRaider definitions carry formulas as XML attributes: ECU scalings \
<scaling expression="..."> (raw to real) and <scaling to_byte="..."> (real to raw), and \
logger <conversion expr="...">, which are either conversions in x or derived parameters over \
[id:unit] and bare id references. rr-core::expr must evaluate the corpus's own formulas as \
JEP did (rr-core/src/expr.rs, rr-core/src/expr/eval.rs "Numeric semantics"); the JEP grammar \
and operator semantics are pinned separately in expr-jep-precedence.toml.

WHY THERE IS NO FORMULA TEXT HERE. The definitions have no licence, so committed fixtures \
hold metadata only (D-028 in .project/DECISIONS.md). Each case names its formula with \
formula_ref: the SHA-256 of the formula's UTF-8 text (printf '%s' "$formula" | sha256sum), \
the corpus-relative file and the positional XPath of the attribute where it first occurs \
(xmllint --xpath 'string(<xpath>)' "$RR_CORPUS_DIR/<path>" prints it). \
fixtures/corpus-formulas.toml lists every distinct corpus formula the same way. The working \
substitutes the case's values into the formula, as any hand check must.

THE SPREAD. The pinned corpus (TD-D/SubaruDefs at 0b0c0c42, the ECU definitions and the \
v290 logger definitions) has 730 distinct formulas: linear scalings with binary-fraction and \
decimal scales, their to_byte inverses, offsets, division by x, unary minus, exponent \
literals (4.8828125e-4, 1.0e2), +- and *- operand prefixes, % and if(...), and derived \
parameters. It has no ^, no BitWise and no function other than if, so those are pinned by \
expr-jep-precedence.toml and expr-bitwise-functions.toml instead.

HOW A CASE IS CHECKED. Exact cases (no tolerance) compare bit for bit, so -0.0 and +0.0 \
differ (-x at 0 is -0.0, 0-x is +0.0). inf and -inf are IEEE 754 division by a signed zero, \
which rr-core reports as EvalError::NonFinite carrying the infinity. % is the remainder with \
the dividend's sign (JLS 15.17.3, as JEP computed it). if(c, a, b) is a when c > 0, else b; \
a comparison is 1 or 0 (JEP 2.x documentation, Operators: "Boolean expressions are evaluated \
to be either 1 or 0"). params binds each reference by its id; the unit only selects which \
conversion of that parameter a logger would feed in.
"""

