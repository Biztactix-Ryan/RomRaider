# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "i64 little-endian: max, min, -1, a negative, a positive"
notes = "u = hi*2^32 + lo (2^32 = 4294967296; lo = bytes 0..4, hi = bytes 4..8, each little-endian); two's complement: raw = u if u < 2^63 (9223372036854775808), else u - 2^64 (18446744073709551616)."

[definition.encoding]
storage = "i64"
endian = "little"

[input]
hex = """
FF FF FF FF FF FF FF 7F
00 00 00 00 00 00 00 80
FF FF FF FF FF FF FF FF
85 FF FF FF FF FF FF FF
EF CD AB 89 67 45 23 01
"""

