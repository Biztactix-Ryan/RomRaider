raw = 9223372036854775807
source = { kind = "hand-calc", working = "bytes FF FF FF FF FF FF FF 7F little-endian: lo = 4294967295, hi = 0x7FFFFFFF = 2147483647; u = 2147483647*4294967296 + 4294967295 = 9223372032559808512 + 4294967295 = 9223372036854775807 = 2^63 - 1; below 2^63, raw = 9223372036854775807 (i64 max)" }

