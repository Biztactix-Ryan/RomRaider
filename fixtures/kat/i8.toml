# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "i8: zero, max, min, -1, a negative, one"
notes = "Two's complement: u = the byte as unsigned; raw = u if u < 128, else u - 256."

[definition.encoding]
storage = "i8"
endian = "big"

[input]
hex = "00 7F 80 FF C8 01"

[[decode]]
offset = 0
raw = 0
source = { kind = "hand-calc", working = "byte 0x00 = 0; 0 < 128 (top bit clear), raw = 0" }

[[decode]]
offset = 1
raw = 127
source = { kind = "hand-calc", working = "byte 0x7F = 7*16 + 15 = 127; 127 < 128 (top bit clear), raw = 127 (i8 max)" }

[[decode]]
offset = 2
raw = -128
source = { kind = "hand-calc", working = "byte 0x80 = 8*16 + 0 = 128; top bit set, two's complement: 128 - 256 = -128 (i8 min)" }

[[decode]]
offset = 3
raw = -1
source = { kind = "hand-calc", working = "byte 0xFF = 15*16 + 15 = 255; top bit set, two's complement: 255 - 256 = -1" }

[[decode]]
offset = 4
raw = -56
source = { kind = "hand-calc", working = "byte 0xC8 = 12*16 + 8 = 200; top bit set, two's complement: 200 - 256 = -56" }

[[decode]]
offset = 5
raw = 1
source = { kind = "hand-calc", working = "byte 0x01 = 0*16 + 1 = 1; top bit clear, raw = 1" }

[[changelog]]
date = 2026-10-19
reason = "initial values"
author = "US-RR-9-8"
