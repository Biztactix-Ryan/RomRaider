[input]
hex = """
FF FF FF FF FF FF FF FF
31 32 33 34 35 36 37 38 39
00 00 00 00
"""

[[checksum]]
algorithm = "xor"
params = { start = 8, end = 17, word = 1, store = "big" }
offset = 17
before = { hex = "00", valid = false, source = { kind = "hand-calc", working = "stored byte 17 = 0x00 = 0*16 + 0 = 0; the XOR is 0x31 = 49, and 0 != 49, so it does not verify" } }
after = { hex = "31", valid = true, source = { kind = "hand-calc", working = "0x31 ^ 0x32 = 0x03; 0x03 ^ 0x33 = 0x30; 0x30 ^ 0x34 = 0x04; 0x04 ^ 0x35 = 0x31; 0x31 ^ 0x36 = 0x07; 0x07 ^ 0x37 = 0x30; 0x30 ^ 0x38 = 0x08; 0x08 ^ 0x39 = 0x31 = 49 (high nibble 3 nine times = 3, low nibbles 1^2^...^9 = 1)" } }
note = "a sum instead of an XOR gives 0xDD"

[[checksum]]
algorithm = "xor"
params = { start = 0, end = 4, word = 1, store = "big" }
offset = 17
before = { hex = "00", valid = true, source = { kind = "hand-calc", working = "all-0xFF, 4 bytes: 0xFF ^ 0xFF = 0x00, twice, so 0x00 ^ 0x00 = 0; stored byte 17 = 0x00 = 0, so it verifies" } }
after = { hex = "00", valid = true, source = { kind = "hand-calc", working = "0xFF ^ 0xFF ^ 0xFF ^ 0xFF = (0xFF ^ 0xFF) ^ (0xFF ^ 0xFF) = 0x00 ^ 0x00 = 0" } }
note = "an even count of equal bytes cancels"

