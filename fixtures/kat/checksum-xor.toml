# Checksum reference vectors: XOR of bytes and of 32-bit words (US-RR-14-7,
# PROJECT.md T2 (d), D-024).
#
# There is no published standard for an XOR checksum, so every expected value
# is worked by hand below. No code was run to produce them: not rr-core, not
# rr-testkit, not legacy, not a throwaway script or calculator.
# crates/rr-testkit/tests/checksum_kat.rs re-derives every case with its own
# small reference implementation on every test run.
#
# Families pinned (US-RR-35's `Xor`; legacy semantics cited, values never
# taken from it):
# * XOR of bytes: BMW byte-XOR (legacy/src/main/java/com/romraider/maps/checksum/ChecksumBYTEXOR.java:77-85,
#   one byte stored at `xorloc`, :72) and the DS2 frame checksum
#   (legacy/src/main/java/com/romraider/io/protocol/ds2/iso9141/DS2ChecksumCalculator.java:29-35);
# * XOR of 32-bit big-endian words: Nissan std/alt/alt2 `xort`
#   (legacy/src/main/java/com/romraider/maps/checksum/CalculateSTD.java:47-51,
#   CalculateALT2.java:49-55, stored big-endian by NissanChecksum.java:79).
#
# XOR has no carries, so a word XOR is the byte XOR of each byte column: the
# word byte order only matters against the store byte order (a little-endian
# word XOR stored little-endian is the same bytes as big-endian stored
# big-endian). Odd-length ranges: see checksum-sum-words.toml; legacy has no
# padding convention (CalculateSTD.java:47-49 reads whole words past `end`),
# and `pad = "zero"` completes the last word with 0x00 bytes at the higher
# addresses, which leaves an XOR unchanged by the pad itself.
schema = 1
title = "XOR checksums (bytes, 32-bit words big/little-endian): ASCII 123456789, all-0xFF, empty, odd length"
notes = """
Shared layout of the checksum vector fixtures (checksum-*.toml), one input:
  bytes  0..8   FF FF FF FF FF FF FF FF   all-0xFF block
  bytes  8..17  31 32 33 34 35 36 37 38 39  ASCII "123456789"
  bytes 17..21  00 00 00 00   the stored-checksum slot, zero as given
Every case reads its region and stores its result at offset 17. `before` is the
zero slot as given (valid only when the expected checksum is itself zero);
`after` is the slot once the checksum is fixed.

algorithm = "xor", params:
  start, end  the region, half-open [start, end)
  word        bytes per operand: 1 or 4 (the result is word bytes wide)
  endian      "big" | "little", for word > 1
  pad         "zero": a last partial word is completed with 0x00 bytes
  store       byte order of the stored result
The XOR of no operands is 0.
"""

