source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "the whole ladder, OrExpression ::= AndExpression ( ( <OR> AndExpression ) )* (lowest) down to PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )? (highest). 0 || ((((1 + (2 * (3^2))) > 18) && (((-1) < 0) == 1))): 3^2 = 9, 2 * 9 = 18, 1 + 18 = 19, 19 > 18 = 1; (-1) < 0 = 1, 1 == 1 = 1; 1 && 1 = 1; 0 || 1 = 1" }

# --------------------------------------------------------------------------------------
# B. Associativity (JEP Grammar): left for + - * / % == != < > <= >= && ||, right for ^.
# --------------------------------------------------------------------------------------

[[expr]]
formula = "10 - 4 - 3"
value = 3.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "AdditiveExpression ::= MultiplicativeExpression ( ( <PLUS> MultiplicativeExpression ) | ( <MINUS> MultiplicativeExpression ) )*, read left to right. (10 - 4) - 3 = 6 - 3 = 3" }
note = "10 - (4 - 3) would be 9"

[[expr]]
formula = "10 - 4 + 3"
value = 9.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "AdditiveExpression ::= MultiplicativeExpression ( ( <PLUS> MultiplicativeExpression ) | ( <MINUS> MultiplicativeExpression ) )*, read left to right. (10 - 4) + 3 = 6 + 3 = 9" }
note = "10 - (4 + 3) would be 3"

[[expr]]
formula = "1e16 + 1 + 1"
value = 1.0e+16
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "AdditiveExpression ::= MultiplicativeExpression ( ( <PLUS> MultiplicativeExpression ) | ( <MINUS> MultiplicativeExpression ) )*, read left to right. (1e16 + 1) + 1: doubles near 1e16 are 2 apart (2^53 < 1e16 < 2^54), so 1e16 + 1 is a tie that rounds to even, 1e16; again + 1 = 1e16" }
note = "1e16 + (1 + 1) would be 10000000000000002: + is not associative in doubles"

[[expr]]
formula = "8 / 4 / 2"
value = 1.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (8 / 4) / 2 = 2 / 2 = 1" }
note = "8 / (4 / 2) would be 4"

[[expr]]
formula = "8 / 2 * 4"
value = 16.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (8 / 2) * 4 = 4 * 4 = 16" }
note = "8 / (2 * 4) would be 1"

[[expr]]
formula = "2 * 7 % 4"
value = 2.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (2 * 7) % 4 = 14 % 4 = 2" }
note = "2 * (7 % 4) would be 6"

[[expr]]
formula = "9 % 4 * 2"
value = 2.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (9 % 4) * 2 = 1 * 2 = 2" }
note = "9 % (4 * 2) would be 1"

[[expr]]
formula = "7 % 5 % 3"
value = 2.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (7 % 5) % 3 = 2 % 3 = 2" }
note = "7 % (5 % 3) would be 1"

[[expr]]
formula = "1e308 * 10 * 0.1"
value = inf
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*, read left to right. (1e308 * 10) * 0.1: 1e308 * 10 = 1e309 overflows the largest double (about 1.8e308) to +inf, and +inf * 0.1 = +inf" }
note = "1e308 * (10 * 0.1) would be 1e308 (10 * 0.1 rounds to 1.0); the final +inf is EvalError::NonFinite"

[[expr]]
formula = "2 == 2 == 1"
value = 1.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "EqualExpression ::= RelationalExpression ( ( <NE> RelationalExpression ) | ( <EQ> RelationalExpression ) )*, read left to right. (2 == 2) == 1 = 1 == 1 = 1" }
note = "2 == (2 == 1) would be 0"

[[expr]]
formula = "3 != 1 != 1"
value = 0.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "EqualExpression ::= RelationalExpression ( ( <NE> RelationalExpression ) | ( <EQ> RelationalExpression ) )*, read left to right. (3 != 1) != 1 = 1 != 1 = 0" }
note = "3 != (1 != 1) would be 1"

[[expr]]
formula = "3 > 2 > 1"
value = 0.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "RelationalExpression ::= AdditiveExpression ( ( <LT> AdditiveExpression ) | ( <GT> AdditiveExpression ) | ( <LE> AdditiveExpression ) | ( <GE> AdditiveExpression ) )*, read left to right. (3 > 2) > 1 = 1 > 1 = 0" }
note = "3 > (2 > 1) would be 1"

[[expr]]
formula = "1 < 3 < 2"
value = 1.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "RelationalExpression ::= AdditiveExpression ( ( <LT> AdditiveExpression ) | ( <GT> AdditiveExpression ) | ( <LE> AdditiveExpression ) | ( <GE> AdditiveExpression ) )*, read left to right. (1 < 3) < 2 = 1 < 2 = 1" }
note = "1 < (3 < 2) would be 0"

[[expr]]
formula = "2 >= 2 <= 0"
value = 0.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "RelationalExpression ::= AdditiveExpression ( ( <LT> AdditiveExpression ) | ( <GT> AdditiveExpression ) | ( <LE> AdditiveExpression ) | ( <GE> AdditiveExpression ) )*, read left to right. (2 >= 2) <= 0 = 1 <= 0 = 0" }
note = "2 >= (2 <= 0) would be 1"

[[expr]]
formula = "1 && 1 && 0"
value = 0.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "AndExpression ::= EqualExpression ( ( <AND> EqualExpression ) )*. (1 && 1) && 0 = 1 && 0 = 0" }

[[expr]]
formula = "0 || 0 || 1"
value = 1.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "OrExpression ::= AndExpression ( ( <OR> AndExpression ) )*. (0 || 0) || 1 = 0 || 1 = 1" }

[[expr]]
formula = "2^3^2"
value = 512.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?: the right operand is a whole UnaryExpression, so ^ is right-associative. 2^(3^2) = 2^9 = 512" }
note = "(2^3)^2 would be 64"

[[expr]]
formula = "2^2^3"
value = 256.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?: the right operand is a whole UnaryExpression, so ^ is right-associative. 2^(2^3) = 2^8 = 256" }
note = "(2^2)^3 would be 64"

[[expr]]
formula = "(2^3)^2"
value = 64.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpressionNotPlusMinus ::= AnyConstant | ( Function | Variable ) | <LRND> Expression <RRND> | ListExpression. parentheses group the left power first: (2^3)^2 = 8^2 = 64" }

[[expr]]
formula = "2^-1^2"
value = 0.5
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression. the right operand of ^ is the UnaryExpression -1^2 = -(1^2) = -1, so 2^-1 = 1/2 = 0.5" }
note = "(2^-1)^2 would be 0.25 and 2^((-1)^2) would be 2"

# --------------------------------------------------------------------------------------
# C. ^ against prefix minus, on both sides of ^ (JEP Grammar: PowerExpression).
# --------------------------------------------------------------------------------------

[[expr]]
formula = "2^-2"
value = 0.25
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression. the exponent may carry a prefix: 2^(-2) = 1/(2*2) = 0.25" }

[[expr]]
formula = "-2^-2"
value = -0.25
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression; PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. -(2^(-2)) = -(1/4) = -0.25" }
note = "(-2)^-2 would be 0.25"

[[expr]]
formula = "(-2)^2"
value = 4.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpressionNotPlusMinus ::= AnyConstant | ( Function | Variable ) | <LRND> Expression <RRND> | ListExpression. a parenthesised negative base: (-2)^2 = (-2)*(-2) = 4" }

[[expr]]
formula = "(-2)^3"
value = -8.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpressionNotPlusMinus ::= AnyConstant | ( Function | Variable ) | <LRND> Expression <RRND> | ListExpression. (-2)^3 = (-2)*(-2)*(-2) = -8" }

[[expr]]
formula = "(-2)^-2"
value = 0.25
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. (-2)^(-2) = 1/((-2)*(-2)) = 1/4 = 0.25" }

[[expr]]
formula = "(-2)^-1"
value = -0.5
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. (-2)^(-1) = 1/(-2) = -0.5" }

[[expr]]
formula = "-(2)^2"
value = -4.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression; PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. the prefix minus applies to the PowerExpression (2)^2: -((2)^2) = -(2*2) = -4" }

[[expr]]
formula = "--2^2"
value = 4.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression; PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. prefixes nest, then apply to the power: -(-(2^2)) = -(-4) = 4" }

[[expr]]
formula = "2 - -2"
value = 4.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "AdditiveExpression ::= MultiplicativeExpression ( ( <PLUS> MultiplicativeExpression ) | ( <MINUS> MultiplicativeExpression ) )*; MultiplicativeExpression ::= UnaryExpression ( ( PowerExpression ) | ( <MUL> UnaryExpression ) | ( <DOT> UnaryExpression ) | ( <CROSS> UnaryExpression ) | ( <DIV> UnaryExpression ) | ( <MOD> UnaryExpression ) )*; UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression. the right operand of binary - is the UnaryExpression -2: 2 - (-2) = 2 + 2 = 4" }

[[expr]]
formula = "x^2"
x = -3.0
value = 9.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?; UnaryExpressionNotPlusMinus ::= AnyConstant | ( Function | Variable ) | <LRND> Expression <RRND> | ListExpression. the base x is a Variable, not a prefix minus: with x = -3, (-3)^2 = (-3)*(-3) = 9" }
note = "contrast -3^2 = -9"

[[expr]]
formula = "-3^2"
value = -9.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | ( <NOT> UnaryExpression ) | PowerExpression; PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. -(3^2) = -(3*3) = -9" }
note = "contrast x^2 with x = -3, which is 9"

[[expr]]
formula = "2^x"
x = -3.0
value = 0.125
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Grammar page: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html", section = "PowerExpression ::= UnaryExpressionNotPlusMinus ( ( <POWER> UnaryExpression ) )?. with x = -3: 2^(-3) = 1/(2*2*2) = 0.125" }

# --------------------------------------------------------------------------------------
# D. ^ values: Math.pow, with JEP's rule that a negative base to a non-integer power is
#    complex (NaN through getValue). Hand-calc; the rules are cited in the notes.
# --------------------------------------------------------------------------------------

[[expr]]
formula = "2^10"
value = 1024.0
source = { kind = "hand-calc", working = "both arguments are integers and 2^10 = 2*2*2*2*2*2*2*2*2*2 = 1024 is exact, so Math.pow gives exactly 1024" }

[[expr]]
formula = "0^0"
value = 1.0
source = { kind = "hand-calc", working = "an exponent of zero gives 1.0 whatever the base: 0^0 = 1, by the first Math.pow special case (x^0 = 1)" }

[[expr]]
formula = "(-0.5)^2"
value = 0.25
source = { kind = "hand-calc", working = "negative base, even integer exponent: |-0.5|^2 = 0.5*0.5 = 0.25" }

[[expr]]
formula = "0^-1"
value = inf
source = { kind = "hand-calc", working = "positive zero to a negative power is +inf (Math.pow special case): 0^-1 = 1/0 = +inf" }
note = "EvalError::NonFinite(+inf)"

[[expr]]
formula = "2^0.5"
value = 1.4142135623730951
tolerance = 1.0e-15
source = { kind = "hand-calc", working = "2^0.5 = sqrt(2); 1.4142135623730951 * 1.4142135623730951 = 2.0000000000000004, the nearest double to sqrt(2)" }

[[expr]]
formula = "4^0.5"
value = 2.0
tolerance = 1.0e-15
source = { kind = "hand-calc", working = "4^0.5 = sqrt(4) = 2, since 2*2 = 4" }

[[expr]]
formula = "-x^0.5"
x = 4.0
value = -2.0
tolerance = 1.0e-15
source = { kind = "hand-calc", working = "with x = 4: -(4^0.5) = -(sqrt 4) = -(2) = -2, since 2*2 = 4 (^ before prefix -)" }

[[expr]]
formula = "0.25^-0.5"
value = 2.0
tolerance = 1.0e-15
source = { kind = "hand-calc", working = "0.25^-0.5 = 1/sqrt(0.25) = 1/0.5 = 2" }

[[expr]]
formula = "8^(1/3)"
value = 2.0
tolerance = 1.0e-15
source = { kind = "hand-calc", working = "1/3 = 0.3333333333333333 (just under one third); 8^(1/3) = cube root of 8 = 2, since 2*2*2 = 8 (the shortfall moves the result by under 1e-16)" }

[[expr]]
formula = "(-8)^(1/3)"
value = nan
source = { kind = "hand-calc", working = "base -8 < 0 and exponent 1/3 = 0.3333 is not an integer, so (-8)^(1/3) has no real value: NaN (JEP: a complex result, which getValue returns as NaN)" }
note = "EvalError::NonFinite(NaN); the real cube root -2 is not what JEP or Math.pow give"

[[expr]]
formula = "(-2)^0.5"
value = nan
source = { kind = "hand-calc", working = "base -2 < 0 and exponent 0.5 = 1/2 is not an integer: (-2)^0.5 = sqrt(-2) is not real, NaN" }
note = "EvalError::NonFinite(NaN)"

[[expr]]
formula = "x^1.5"
x = -4.0
value = nan
source = { kind = "hand-calc", working = "with x = -4: base -4 < 0 and exponent 1.5 = 3/2 is not an integer, so (-4)^1.5 is not real: NaN" }
note = "EvalError::NonFinite(NaN)"

# --------------------------------------------------------------------------------------
# E. % is Java's floating-point remainder: the sign of the dividend (hand-calc from the
#    rule cited in the notes; the JEP Functions page says mod(x,y) = x % y).
# --------------------------------------------------------------------------------------

[[expr]]
formula = "7 % 3"
value = 1.0
source = { kind = "hand-calc", working = "q = trunc(7/3) = trunc(2.33) = 2; r = 7 - 3*2 = 7 - 6 = 1" }

[[expr]]
formula = "-7 % 3"
value = -1.0
source = { kind = "hand-calc", working = "prefix - binds tighter than %, so (-7) % 3: q = trunc(-7/3) = trunc(-2.33) = -2; r = -7 - 3*(-2) = -7 + 6 = -1 (sign of the dividend)" }
note = "a floored modulo (Python, Excel MOD) would give 2"

[[expr]]
formula = "7 % -3"
value = 1.0
source = { kind = "hand-calc", working = "q = trunc(7/(-3)) = trunc(-2.33) = -2; r = 7 - (-3)*(-2) = 7 - 6 = 1 (sign of the dividend)" }
note = "a floored modulo would give -2"

[[expr]]
formula = "-7 % -3"
value = -1.0
source = { kind = "hand-calc", working = "q = trunc((-7)/(-3)) = trunc(2.33) = 2; r = -7 - (-3)*2 = -7 + 6 = -1" }

[[expr]]
formula = "5.5 % 2"
value = 1.5
source = { kind = "hand-calc", working = "q = trunc(5.5/2) = trunc(2.75) = 2; r = 5.5 - 2*2 = 5.5 - 4 = 1.5" }

[[expr]]
formula = "x % 4"
x = 10.75
value = 2.75
source = { kind = "hand-calc", working = "with x = 10.75: q = trunc(10.75/4) = trunc(2.6875) = 2; r = 10.75 - 4*2 = 10.75 - 8 = 2.75" }

[[expr]]
formula = "-4 % 2"
value = -0.0
source = { kind = "hand-calc", working = "q = trunc(-4/2) = -2; r = -4 - 2*(-2) = -4 + 4 = -0.0: a zero result keeps the sign of the dividend" }
note = "exact cases compare bits, so +0.0 here fails"

[[expr]]
formula = "0 % 5"
value = 0.0
source = { kind = "hand-calc", working = "a zero dividend with a finite divisor is the dividend: 0 % 5 = 0 - 5*0 = 0" }

[[expr]]
formula = "7 % 0"
value = nan
source = { kind = "hand-calc", working = "a zero divisor gives NaN: 7 % 0 = 7 - 0*q has no q, so NaN" }
note = "EvalError::NonFinite(NaN)"

[[expr]]
formula = "mod(-7, 3)"
value = -1.0
source = { kind = "standard", doc = "JEP 2.x documentation (Singular Systems, 2006), Functions page: https://web.archive.org/web/20060621030023/http://www.singularsys.com/jep/doc/html/functions.html", section = "Functions added with addStandardFunctions(): Modulus, \"mod(x,y) = x % y\"; so mod(-7, 3) = -7 % 3 = -7 - 3*(-2) = -1" }

# --------------------------------------------------------------------------------------
# F. Comparison and logical results are 1 or 0 (JEP Operators); prefix !.
# --------------------------------------------------------------------------------------

[[expr]]
formula = "3 > 2"
value = 1.0
