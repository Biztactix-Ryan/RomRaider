# JEP operator precedence, associativity and ^ semantics (US-RR-20-2).
#
# Every value was derived by hand: the parse from the JEP 2.x grammar (quoted in
# each `standard` source), then the arithmetic. They were cross-checked
# independently with Python (an explicitly parenthesised expression per case,
# math.fmod for %, math.pow for ^), never with rr-core or rr-testkit code and
# never with Java (D-024).
#
# Consumed by crates/rr-testkit/tests/expr_kat.rs, which parses every formula
# with rr_core::expr::parse and evaluates it at `x`.
schema = 1
title = "JEP 2.x operator precedence, associativity, ^, % and boolean results, plus rr-core's native & | << >>"
notes = """
WHAT THIS PINS. RomRaider formulas were JEP 2.x expressions (legacy/lib/common/jep.jar, the \
org.nfunk.jep package, class files dated 2006-03-11; legacy builds each parser with \
addStandardFunctions() and reads the result with getValue(), util/JEPUtil.java:50 and :59). \
rr-core::expr must read them the way JEP did.

SOURCES (JEP documentation, Singular Systems, (c) 2006; archived copies, the live pages are \
gone). The snapshots closest to the jar's date were chosen:
* Grammar: https://web.archive.org/web/20060621025658/http://www.singularsys.com/jep/doc/html/grammar.html \
"This grammar was generated from the Parser.jj file using the jjdoc utility from JavaCC. \
Operators are ordered from lowest to highest precedence (from top to bottom)." The productions, \
top to bottom: OrExpression (<OR>), AndExpression (<AND>), EqualExpression (<NE> <EQ>), \
RelationalExpression (<LT> <GT> <LE> <GE>), AdditiveExpression (<PLUS> <MINUS>), \
MultiplicativeExpression (<MUL> <DOT> <CROSS> <DIV> <MOD>, and the implicit-multiplication \
alternative), UnaryExpression ::= ( <PLUS> UnaryExpression ) | ( <MINUS> UnaryExpression ) | \
( <NOT> UnaryExpression ) | PowerExpression, and PowerExpression ::= UnaryExpressionNotPlusMinus \
( ( <POWER> UnaryExpression ) )?. Every binary level is "X ( op X )*", so left-associative; ^ \
takes a whole UnaryExpression on its right, so it is right-associative and its exponent may \
carry a prefix (2^-2), while its base may not (-2^2 is -(2^2)). The 2006-02-05 snapshot \
(web.archive.org/web/20060205040755/...) has the same productions; so does the 2008 snapshot \
that rr-core/src/expr.rs cites.
* Operators: https://web.archive.org/web/20060621030056/http://www.singularsys.com/jep/doc/html/operators.html \
"Built in operators": "Boolean expressions are evaluated to be either 1 or 0 (true or false \
respectively)." Its table lists, top to bottom, Power ^, Boolean Not !, Unary Plus/Minus, \
Modulus %, Division /, Multiplication *, Addition/Subtraction, <= >=, < >, != ==, &&, ||, and \
says "Refer to the grammar for detailed information about operator precedence"; the grammar is \
the authority (the table splits levels the grammar merges, such as * and /).
* Functions: https://web.archive.org/web/20060621030023/http://www.singularsys.com/jep/doc/html/functions.html \
"Functions added with addStandardFunctions()": Modulus, "mod(x,y) = x % y".

The documentation does not give numeric rules for ^ and %; JEP computes them with the platform's \
Math.pow and floating-point remainder (rr-core/src/expr/eval.rs "Numeric semantics" cites the \
jep.jar classes). Groups D and E are therefore hand calculations from those rules:
* ^: the Math.pow specification, docs.oracle.com/javase/8/docs/api/java/lang/Math.html#pow-double-double- \
("If the second argument is positive or negative zero, then the result is 1.0"; for a finite \
negative base, "if the second argument is finite and not an integer, then the result is NaN"; \
"If both arguments are integers, then the result is exactly equal to the mathematical result \
... if that result can in fact be represented exactly"; "The computed result must be within 1 \
ulp of the exact result"). JEP itself turns a negative base with a non-integer exponent into a \
complex number, which getValue() returns as NaN: the same value.
* %: the language specification's remainder rule, docs.oracle.com/javase/specs/jls/se8/html/jls-15.html#jls-15.17.3 \
("the sign of the result equals the sign of the dividend"; "If the dividend is an infinity, or \
the divisor is a zero, or both, the result is NaN"; "If the dividend is a zero and the divisor \
is finite, the result equals the dividend"; otherwise r = n - (d * q) with q the quotient \
truncated toward zero).

Group N is NOT JEP: JEP has no & | << >> (its ^ is power). They are rr-core's own extension \
(US-RR-20, D-008 in .project/DECISIONS.md), specified in rr-core/src/expr.rs "Precedence" \
(shifts just below + -, & tighter than |, both tighter than the comparisons) and \
rr-core/src/expr/eval.rs "Integer operations" (operands to Java int toward zero, shift distance \
mod 32). Those sections are the source; the values are hand calculations from them.

HOW A CASE IS CHECKED. The formula must parse; evaluated at `x` it must give `value`:
* exact cases (no `tolerance`) compare bit for bit, so -0.0 and +0.0 differ;
* `tolerance` (absolute) is given only where Math.pow allows 1 ulp of error: a non-integer \
exponent. Every such value is below 4 in magnitude, where 1 ulp is at most 4.5e-16, so the tolerance is 1e-15;
* a value of nan, inf or -inf is what JEP returns; rr-core reports a final non-finite value as \
EvalError::NonFinite carrying it (rr-core/src/expr/eval.rs "Non-finite results"), so the test \
expects Err(NonFinite(v)) with v NaN, or the same infinity.
"""


# --------------------------------------------------------------------------------------
# A. Precedence ladder (JEP Grammar): every adjacent pair of levels, both ways where the
#    arithmetic tells them apart, a few non-adjacent pairs, and the whole ladder at once.
# --------------------------------------------------------------------------------------

[[expr]]
