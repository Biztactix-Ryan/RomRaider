# --------------------------------------------------------------------------------------
# N. NOT JEP: rr-core's native & | << >> (US-RR-20 / D-008). JEP has no such operators;
#    the source for these is our own decision, rr-core/src/expr.rs "Precedence" and
#    rr-core/src/expr/eval.rs "Integer operations". Hand-calc.
# --------------------------------------------------------------------------------------

[[expr]]
formula = "6 | 1 & 3"
value = 7.0
source = { kind = "hand-calc", working = "& binds tighter than |: 6 | (1 & 3) = 6 | 1 = 0b110 | 0b001 = 0b111 = 7" }
note = "(6 | 1) & 3 would be 3"

[[expr]]
formula = "12 & 1 << 2"
value = 4.0
source = { kind = "hand-calc", working = "<< binds tighter than &: 12 & (1 << 2) = 12 & 4 = 0b1100 & 0b0100 = 4" }
note = "(12 & 1) << 2 would be 0"

[[expr]]
formula = "1 << 2 + 1"
value = 8.0
source = { kind = "hand-calc", working = "+ binds tighter than <<: 1 << (2 + 1) = 1 << 3 = 8" }
note = "(1 << 2) + 1 would be 5"

[[expr]]
formula = "x >> 8 + 1"
x = 1024.0
value = 2.0
source = { kind = "hand-calc", working = "+ binds tighter than >>: with x = 1024, 1024 >> (8 + 1) = 1024 >> 9 = 1024/512 = 2" }
note = "(x >> 8) + 1 would be 5"

[[expr]]
formula = "x & 4 == 4"
x = 6.0
value = 1.0
source = { kind = "hand-calc", working = "& binds tighter than ==, unlike C: with x = 6, (6 & 4) == 4 = 4 == 4 = 1" }
note = "C's 6 & (4 == 4) would be 0"

[[expr]]
formula = "1 | 2 < 3"
value = 0.0
source = { kind = "hand-calc", working = "| binds tighter than <: (1 | 2) < 3 = 3 < 3 = 0" }
note = "1 | (2 < 3) would be 1"

[[expr]]
formula = "x & 255 | 256"
x = 4660.0
value = 308.0
source = { kind = "hand-calc", working = "with x = 4660 = 0x1234: (0x1234 & 0xFF) | 0x100 = 0x34 | 0x100 = 52 + 256 = 308" }
note = "4660 & (255 | 256) would be 52"

[[expr]]
formula = "256 >> 2 >> 1"
value = 32.0
source = { kind = "hand-calc", working = "shifts are left-associative: (256 >> 2) >> 1 = 64 >> 1 = 32" }
note = "256 >> (2 >> 1) would be 128"

[[expr]]
formula = "1 << 1 << 2"
value = 8.0
source = { kind = "hand-calc", working = "(1 << 1) << 2 = 2 << 2 = 8" }
note = "1 << (1 << 2) would be 16"

[[expr]]
formula = "-1 >> 1"
value = -1.0
source = { kind = "hand-calc", working = "prefix - binds tighter than >>, and >> on an int is arithmetic: (-1) >> 1 = 0xFFFFFFFF >> 1 (sign-filled) = -1" }

[[expr]]
formula = "5.9 & 3"
value = 1.0
source = { kind = "hand-calc", working = "operands go to int toward zero first: 5.9 -> 5; 5 & 3 = 0b101 & 0b011 = 0b001 = 1" }

[[expr]]
formula = "1 << 32"
value = 1.0
source = { kind = "hand-calc", working = "an int shift uses the low five bits of its distance: 32 & 31 = 0, so 1 << 0 = 1" }

