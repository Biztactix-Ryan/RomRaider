41 4B 00  41 4B FF  41 4B 40
41 4C 00  41 4C FF  41 4C 33
41 52 00  41 52 FF  41 52 0D
41 5A 00  41 5A FF  41 5A 66
41 5B 00  41 5B FF  41 5B B3
"""

