# SAE J1979 service $01 PID vectors (US-RR-14-6, PROJECT.md T2 (d), D-024):
# engine fuel rate (256 A + B)/20 L/h.
#
# Formula sources. SAE J1979 and ISO 15031-5 are paywalled and were not
# consulted; the formula is taken from two secondary sources that attribute
# it to SAE J1979, which agree (see `notes`): Wikipedia's "OBD-II PIDs" table
# and CSS Electronics' service 01 PID CSV. The response framing (0x41 = 0x01 +
# 0x40, then the PID echoed, then the data bytes A, B, ...) is from the ELM327
# datasheet (ELM327DSJ, pp. 31-32). The input is service-layer bytes only:
# no transport framing (ISO 15765-2 PCI byte, ISO 14230 / 9141 header and
# checksum).
#
# Which PIDs: the mode 01 PIDs legacy RomRaider's OBD logger offers
# (<protocol id="OBD"> of the pinned logger definition, corpus tier,
# defs/romraider/logger/logger_STD_EN_v290.xml:34769; the same PIDs in
# logger_v370). Each PID and the line of its <parameter> there:
# 5E line 35383.
#
# Every value was worked from Wikipedia's formula in exact rational arithmetic
# (Python fractions, in a throwaway authoring script kept outside the
# repository, which also wrote each step into the working) and recomputed
# from CSS's scale and offset as an independent check; the two ELM327
# examples match the datasheet. Never with rr-core, rr-testkit or legacy
# code. Review by recomputing a working by hand.
# Each PID has a case with every data byte 0x00, one with every data byte
# 0xFF, and at least one typical value.
schema = 1
title = "SAE J1979 service 01: engine fuel rate (256 A + B)/20 L/h"
notes = """
Standard: SAE J1979 (E/E Diagnostic Test Modes), service $01 (show current data), PIDs 5E.
Edition and table not verified first-hand: SAE J1979 and ISO 15031-5 are paywalled. Wikipedia's
"Further reading" lists SAE J1979 (2017-02-16, doi:10.4271/J1979_201702) and its Digital Annex
SAE J1979-DA (2017-02-16, doi:10.4271/J1979DA_201702); neither was consulted.
Via (secondary): Wikipedia, "OBD-II PIDs", revision 1374011962 (2026-09-09T07:43:07Z), section "Service 01 - Show current data", Formula column, rows 5E: (256 A + B)/20.
Via (secondary): CSS Electronics, "OBD2 PID table, service 01" CSV (https://canlogger.csselectronics.com/files/misc/obd2-pid-table-service-01.csv, retrieved 2026-10-22, SHA-256 3283f807111a5176bb13724477b62e20ee84386d4b031dc60301759e5be160d1), rows 5E: scale 0.05, offset 0.
Framing: Elm Electronics ELM327 datasheet, revision ELM327DSJ, "Talking to the Vehicle", pp. 31-32: a mode 01 response is 0x41 (0x01 + 0x40), the PID echoed, then the data bytes.
Each case's offset is the first data byte (A) of one response; the two bytes before it are 0x41 and the PID.
Formula: rate = (256*A + B)/20 L/h, 0 to 3276.75 L/h.
PIDs: 0x5E engine fuel rate.
Wikipedia gives a maximum of 3212.75 L/h; (256*255 + 255)/20 is 3276.75 (CSS: 3277). The formula is what is pinned.
"""

# The document these values rest on (US-RR-14-1, validator rule `citation`).
# Flagged exception: SAE J1979 is paywalled, so its edition and section were
# not read first-hand (`verified = false`); the formula comes from the `via`
# sources. Allowed only in the j1979-01-* fixtures.
[[citation]]
kind = "standard"
doc = "SAE J1979"
edition = "2017-02 (J1979_201702, as Wikipedia lists it; not consulted)"
section = "service $01 (show current data), PID 0x5E"
verified = false
via = [
  "Wikipedia, \"OBD-II PIDs\", revision 1374011962 (2026-09-09T07:43:07Z), section \"Service 01 - Show current data\", Formula column, rows 5E: (256 A + B)/20.",
  "CSS Electronics, \"OBD2 PID table, service 01\" CSV (https://canlogger.csselectronics.com/files/misc/obd2-pid-table-service-01.csv, retrieved 2026-10-22, SHA-256 3283f807111a5176bb13724477b62e20ee84386d4b031dc60301759e5be160d1), rows 5E: scale 0.05, offset 0.",
]
note = "SAE J1979 and ISO 15031-5 are paywalled and were not consulted. `edition` is the edition Wikipedia's \"Further reading\" lists (SAE J1979 and its Digital Annex SAE J1979-DA, both 2017-02-16, doi:10.4271/J1979_201702 and doi:10.4271/J1979DA_201702), not one these values were checked against; `section` is the service and PID, not a clause or table number, which is unknown. The formula is taken from the `via` sources, which attribute it to SAE J1979."

[definition.encoding]
storage = "u16"
endian = "big"

[definition.conversion]
to_real = "x/20"
units = "L/h"

[input]
hex = """
41 5E 00 00  41 5E FF FF  41 5E 00 C8
"""

[[decode]]
offset = 2
raw = 0
real = 0.0
source = { kind = "hand-calc", working = "PID 0x5E response 41 5E 00 00: A = 0x00 = 0*16 + 0 = 0, B = 0x00 = 0*16 + 0 = 0; raw = 256*0 + 0 = 0; rate = 0/20 = 0.0" }
note = "boundary: every data byte 0x00"

[[decode]]
offset = 6
raw = 65535
real = 3276.75
source = { kind = "hand-calc", working = "PID 0x5E response 41 5E FF FF: A = 0xFF = 15*16 + 15 = 255, B = 0xFF = 15*16 + 15 = 255; raw = 256*255 + 255 = 65535; rate = 65535/20 = 3276.75" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 10
raw = 200
real = 10.0
source = { kind = "hand-calc", working = "PID 0x5E response 41 5E 00 C8: A = 0x00 = 0*16 + 0 = 0, B = 0xC8 = 12*16 + 8 = 200; raw = 256*0 + 200 = 200; rate = 200/20 = 10.0" }

[[changelog]]
date = 2026-10-22
reason = "initial values"
author = "US-RR-14-6"
