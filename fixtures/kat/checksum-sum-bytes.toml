after = { hex = "01 DD", valid = true, source = { kind = "hand-calc", working = "49+50+51+52+53+54+55+56+57 = 477 = 1*256 + 221 = 0x01DD (no wrap: 477 < 65536), stored big-endian 01 DD" } }
note = "an 8-bit accumulator would lose the 01"

