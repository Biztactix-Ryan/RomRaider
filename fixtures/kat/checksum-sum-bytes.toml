[[checksum]]
algorithm = "sum"
params = { start = 8, end = 17, word = 1, width = 8, store = "big" }
offset = 17
before = { hex = "00", valid = false, source = { kind = "hand-calc", working = "stored byte 17 = 0x00 = 0*16 + 0 = 0; the sum is 0xDD = 221, and 0 != 221, so it does not verify" } }
after = { hex = "DD", valid = true, source = { kind = "hand-calc", working = "0x31+0x32+0x33+0x34+0x35+0x36+0x37+0x38+0x39 = 49+50+51+52+53+54+55+56+57 = 477 = 0x1DD; 477 mod 256 = 477 - 256 = 221 = 0xDD" } }
note = "the 0x100 carry is dropped: a 16-bit accumulator would store 01 DD"

[[checksum]]
algorithm = "sum"
params = { start = 0, end = 4, word = 1, width = 8, store = "big" }
offset = 17
before = { hex = "00", valid = false, source = { kind = "hand-calc", working = "stored byte 17 = 0x00 = 0*16 + 0 = 0; the sum is 0xFC = 252, and 0 != 252, so it does not verify" } }
after = { hex = "FC", valid = true, source = { kind = "hand-calc", working = "all-0xFF: 0xFF*4 = 255*4 = 1020 = 0x3FC; 1020 mod 256 = 1020 - 3*256 = 252 = 0xFC" } }
note = "wraps three times; a signed-byte sum would give -4 = 0xFC too, so this case does not catch sign handling (the 16-bit cases do)"

