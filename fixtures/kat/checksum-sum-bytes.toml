# Checksum reference vectors: additive sums of single bytes (US-RR-14-7,
# PROJECT.md T2 (d), D-024).
#
# There is no published standard for a byte sum, so every expected value is
# worked by hand below (the working shows each addition and each wrap). No
# code was run to produce them: not rr-core, not rr-testkit, not legacy, not
# a throwaway script or calculator. crates/rr-testkit/tests/checksum_kat.rs
# re-derives every case with its own small reference implementation on every
# test run, so an arithmetic slip here fails a test.
#
# Families pinned (the arithmetic of the checksum engine, US-RR-35 and
# PROJECT.md D-009; legacy semantics cited, values never taken from it):
# * 8-bit byte sum: the SSM and NCS frame checksums
#   (legacy/src/main/java/com/romraider/io/protocol/ssm/iso9141/SSMChecksumCalculator.java:31-37,
#   legacy/src/main/java/com/romraider/io/protocol/ncs/iso14230/NCSChecksumCalculator.java:31-37);
# * 16-bit sum of unsigned bytes with an initial value: Motronic single and
#   double (legacy/src/main/java/com/romraider/maps/checksum/ChecksumMOTRONICSINGLE.java:49-50
#   for `initial`, :86-93 for the sum into a Java short, i.e. mod 2^16;
#   ChecksumMOTRONICDOUBLE.java:53-54 chains a second range with the first
#   result as its initial value).
schema = 1
title = "Byte sums mod 2^8 and mod 2^16 (with initial value): ASCII 123456789, all-0xFF, empty, wrap"
notes = """
Shared layout of the checksum vector fixtures (checksum-*.toml), one input:
  bytes  0..8   FF FF FF FF FF FF FF FF   all-0xFF block
  bytes  8..17  31 32 33 34 35 36 37 38 39  ASCII "123456789", the standard check input
  bytes 17..21  00 00 00 00   the stored-checksum slot, zero as given
Every case reads its region and stores its result at offset 17. `before` is the
zero slot as given (valid only when the expected checksum is itself zero);
`after` is the slot once the checksum is fixed.

algorithm = "sum", params:
  start, end  the summed region, half-open [start, end) (legacy Motronic's end is
              inclusive, ChecksumMOTRONICSINGLE.java:88; the vectors use half-open)
  word        bytes per addend: 1 here (each byte unsigned, 0..255)
  width       accumulator bits: the sum is taken mod 2^width
  init        initial value of the accumulator (default 0; Motronic `initial`)
  store       byte order of the stored result, which is width/8 bytes ("big" for
              every legacy store)

ASCII "123456789" = 0x31..0x39 = 49..57; their sum is 49+50+51+52+53+54+55+56+57 =
9*53 = 477 = 0x1DD.
"""

# The documents these values rest on (US-RR-14-1, validator rule `citation`).
# Flagged exception: no published standard defines these sums, so the
# citations are the legacy code whose algorithm the hand-worked values model
# (`legacy-algorithm`, allowed only in the checksum sum and XOR fixtures).
