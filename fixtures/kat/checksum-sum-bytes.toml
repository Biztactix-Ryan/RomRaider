after = { hex = "00 1D", valid = true, source = { kind = "hand-calc", working = "init 0xFE40 = 65088; 65088 + 477 = 65565; 65565 mod 65536 = 65565 - 65536 = 29 = 0x001D, stored big-endian 00 1D" } }
note = "the initial value is added before the wrap; ignoring init gives 01 DD"

