# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "i16 big-endian: zero, max, min, -1, a negative, a positive"
notes = "u = b0*256 + b1; two's complement: raw = u if u < 32768, else u - 65536."

[definition.encoding]
storage = "i16"
endian = "big"

[input]
hex = "00 00  7F FF  80 00  FF FF  FF 38  01 00"

[[decode]]
offset = 0
raw = 0
source = { kind = "hand-calc", working = "bytes 00 00 big-endian: u = 0*256 + 0 = 0; 0 < 32768, raw = 0" }

[[decode]]
offset = 2
raw = 32767
source = { kind = "hand-calc", working = "bytes 7F FF big-endian: u = 127*256 + 255 = 32512 + 255 = 32767; 32767 < 32768, raw = 32767 (i16 max)" }

[[decode]]
offset = 4
raw = -32768
source = { kind = "hand-calc", working = "bytes 80 00 big-endian: u = 128*256 + 0 = 32768; top bit set, two's complement: 32768 - 65536 = -32768 (i16 min)" }

[[decode]]
offset = 6
raw = -1
source = { kind = "hand-calc", working = "bytes FF FF big-endian: u = 255*256 + 255 = 65535; top bit set, two's complement: 65535 - 65536 = -1" }

[[decode]]
offset = 8
raw = -200
source = { kind = "hand-calc", working = "bytes FF 38 big-endian: u = 255*256 + 56 = 65280 + 56 = 65336; top bit set, two's complement: 65336 - 65536 = -200" }

[[decode]]
offset = 10
raw = 256
source = { kind = "hand-calc", working = "bytes 01 00 big-endian: u = 1*256 + 0 = 256; 256 < 32768, raw = 256" }
note = "reads 1 if the byte order is wrong"

[[changelog]]
date = 2026-10-19
reason = "initial values"
author = "US-RR-9-8"
