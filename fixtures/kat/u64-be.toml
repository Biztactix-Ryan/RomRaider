# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "u64 big-endian: zero, mixed bytes, top bit set, max"
notes = "Eight-byte cells, worked as two 32-bit halves: value = hi*2^32 + lo with 2^32 = 4294967296. Values above i64::MAX are written as strings (TOML integers are i64)."

[definition.encoding]
storage = "u64"
endian = "big"

[input]
hex = """
00 00 00 00 00 00 00 00
01 23 45 67 89 AB CD EF
80 00 00 00 00 00 00 00
FF FF FF FF FF FF FF FF
"""

[[decode]]
offset = 0
raw = 0
source = { kind = "hand-calc", working = "bytes 00 x8: hi = 0, lo = 0; 0*4294967296 + 0 = 0" }

[[decode]]
offset = 8
raw = 81985529216486895
source = { kind = "hand-calc", working = "bytes 01 23 45 67 | 89 AB CD EF big-endian: hi = 0x01234567 = 1*16777216 + 35*65536 + 69*256 + 103 = 19088743; lo = 0x89ABCDEF = 137*16777216 + 171*65536 + 205*256 + 239 = 2309737967; 19088743*4294967296 + 2309737967 = 81985526906748928 + 2309737967 = 81985529216486895 (0x0123456789ABCDEF)" }

[[decode]]
offset = 16
raw = "9223372036854775808"
source = { kind = "hand-calc", working = "bytes 80 00 00 00 | 00 00 00 00 big-endian: hi = 0x80000000 = 2147483648, lo = 0; 2147483648*4294967296 + 0 = 9223372036854775808 = 2^63; unsigned, no sign extension" }
note = "top bit set, above i64::MAX: must not be read as signed"

[[decode]]
offset = 24
raw = "18446744073709551615"
source = { kind = "hand-calc", working = "bytes FF x8 big-endian: hi = lo = 0xFFFFFFFF = 4294967295; 4294967295*4294967296 + 4294967295 = 18446744069414584320 + 4294967295 = 18446744073709551615 = 2^64 - 1 (u64 max)" }

