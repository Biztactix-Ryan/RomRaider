# SAE J1979 service $01 PID vectors (US-RR-14-6, PROJECT.md T2 (d), D-024):
# one-byte temperatures A - 40 degC.
#
# Formula sources. SAE J1979 and ISO 15031-5 are paywalled and were not
# consulted; the formula is taken from two secondary sources that attribute
# it to SAE J1979, which agree (see `notes`): Wikipedia's "OBD-II PIDs" table
# and CSS Electronics' service 01 PID CSV. The response framing (0x41 = 0x01 +
# 0x40, then the PID echoed, then the data bytes A, B, ...) is from the ELM327
# datasheet (ELM327DSJ, pp. 31-32). The input is service-layer bytes only:
# no transport framing (ISO 15765-2 PCI byte, ISO 14230 / 9141 header and
# checksum).
#
# Which PIDs: the mode 01 PIDs legacy RomRaider's OBD logger offers
# (<protocol id="OBD"> of the pinned logger definition, corpus tier,
# defs/romraider/logger/logger_STD_EN_v290.xml:34769; the same PIDs in
# logger_v370). Each PID and the line of its <parameter> there:
# 05 line 34801, 0F line 34869, 46 line 35242, 5C line 35370.
#
# Every value was worked from Wikipedia's formula in exact rational arithmetic
# (Python fractions, in a throwaway authoring script kept outside the
# repository, which also wrote each step into the working) and recomputed
# from CSS's scale and offset as an independent check; the two ELM327
# examples match the datasheet. Never with rr-core, rr-testkit or legacy
# code. Review by recomputing a working by hand.
# Each PID has a case with every data byte 0x00, one with every data byte
# 0xFF, and at least one typical value.
schema = 1
title = "SAE J1979 service 01: one-byte temperatures A - 40 degC"
notes = """
Standard: SAE J1979 (E/E Diagnostic Test Modes), service $01 (show current data), PIDs 05, 0F, 46, 5C.
Edition and table not verified first-hand: SAE J1979 and ISO 15031-5 are paywalled. Wikipedia's
"Further reading" lists SAE J1979 (2017-02-16, doi:10.4271/J1979_201702) and its Digital Annex
SAE J1979-DA (2017-02-16, doi:10.4271/J1979DA_201702); neither was consulted.
Via (secondary): Wikipedia, "OBD-II PIDs", revision 1374011962 (2026-09-09T07:43:07Z), section "Service 01 - Show current data", Formula column, rows 05, 0F, 46, 5C: A - 40.
Via (secondary): CSS Electronics, "OBD2 PID table, service 01" CSV (https://canlogger.csselectronics.com/files/misc/obd2-pid-table-service-01.csv, retrieved 2026-10-22, SHA-256 3283f807111a5176bb13724477b62e20ee84386d4b031dc60301759e5be160d1), rows 05, 0F, 46, 5C: scale 1, offset -40.
Framing: Elm Electronics ELM327 datasheet, revision ELM327DSJ, "Talking to the Vehicle", pp. 31-32: a mode 01 response is 0x41 (0x01 + 0x40), the PID echoed, then the data bytes.
Each case's offset is the first data byte (A) of one response; the two bytes before it are 0x41 and the PID.
Formula: temperature = A - 40 degC, -40 to 215 degC.
PIDs: 0x05 engine coolant temperature; 0x0F intake air temperature; 0x46 ambient air temperature; 0x5C engine oil temperature.
Wikipedia gives PID 5C a maximum of 210 degC; A - 40 at A = 255 is 215 (CSS: 215). The formula is what is pinned.
"""

# The document these values rest on (US-RR-14-1, validator rule `citation`).
# Flagged exception: SAE J1979 is paywalled, so its edition and section were
# not read first-hand (`verified = false`); the formula comes from the `via`
# sources. Allowed only in the j1979-01-* fixtures.
[[citation]]
kind = "standard"
doc = "SAE J1979"
edition = "2017-02 (J1979_201702, as Wikipedia lists it; not consulted)"
section = "service $01 (show current data), PIDs 0x05, 0x0F, 0x46, 0x5C"
verified = false
via = [
  "Wikipedia, \"OBD-II PIDs\", revision 1374011962 (2026-09-09T07:43:07Z), section \"Service 01 - Show current data\", Formula column, rows 05, 0F, 46, 5C: A - 40.",
  "CSS Electronics, \"OBD2 PID table, service 01\" CSV (https://canlogger.csselectronics.com/files/misc/obd2-pid-table-service-01.csv, retrieved 2026-10-22, SHA-256 3283f807111a5176bb13724477b62e20ee84386d4b031dc60301759e5be160d1), rows 05, 0F, 46, 5C: scale 1, offset -40.",
]
note = "SAE J1979 and ISO 15031-5 are paywalled and were not consulted. `edition` is the edition Wikipedia's \"Further reading\" lists (SAE J1979 and its Digital Annex SAE J1979-DA, both 2017-02-16, doi:10.4271/J1979_201702 and doi:10.4271/J1979DA_201702), not one these values were checked against; `section` is the service and PID, not a clause or table number, which is unknown. The formula is taken from the `via` sources, which attribute it to SAE J1979."

[definition.encoding]
storage = "u8"
endian = "big"

[definition.conversion]
to_real = "x-40"
units = "degC"

[input]
hex = """
41 05 00  41 05 FF  41 05 7B  41 05 28
41 0F 00  41 0F FF  41 0F 41
41 46 00  41 46 FF  41 46 3C
41 5C 00  41 5C FF  41 5C 82
"""

[[decode]]
offset = 2
raw = 0
real = -40.0
source = { kind = "hand-calc", working = "PID 0x05 response 41 05 00: A = 0x00 = 0*16 + 0 = 0; raw = A = 0; temperature = 0 - 40 = -40.0" }
note = "boundary: every data byte 0x00"

[[decode]]
offset = 5
raw = 255
real = 215.0
source = { kind = "hand-calc", working = "PID 0x05 response 41 05 FF: A = 0xFF = 15*16 + 15 = 255; raw = A = 255; temperature = 255 - 40 = 215.0" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 8
raw = 123
real = 83.0
source = { kind = "hand-calc", working = "PID 0x05 response 41 05 7B: A = 0x7B = 7*16 + 11 = 123; raw = A = 123; temperature = 123 - 40 = 83.0" }
note = "the ELM327 datasheet's own example (ELM327DSJ p. 31: 41 05 7B is 123 - 40 = 83 degC)"

[[decode]]
offset = 11
raw = 40
real = 0.0
source = { kind = "hand-calc", working = "PID 0x05 response 41 05 28: A = 0x28 = 2*16 + 8 = 40; raw = A = 40; temperature = 40 - 40 = 0.0" }

[[decode]]
offset = 14
raw = 0
real = -40.0
source = { kind = "hand-calc", working = "PID 0x0F response 41 0F 00: A = 0x00 = 0*16 + 0 = 0; raw = A = 0; temperature = 0 - 40 = -40.0" }
note = "boundary: every data byte 0x00"

[[decode]]
offset = 17
raw = 255
real = 215.0
source = { kind = "hand-calc", working = "PID 0x0F response 41 0F FF: A = 0xFF = 15*16 + 15 = 255; raw = A = 255; temperature = 255 - 40 = 215.0" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 20
raw = 65
real = 25.0
source = { kind = "hand-calc", working = "PID 0x0F response 41 0F 41: A = 0x41 = 4*16 + 1 = 65; raw = A = 65; temperature = 65 - 40 = 25.0" }

[[decode]]
offset = 23
raw = 0
real = -40.0
source = { kind = "hand-calc", working = "PID 0x46 response 41 46 00: A = 0x00 = 0*16 + 0 = 0; raw = A = 0; temperature = 0 - 40 = -40.0" }
note = "boundary: every data byte 0x00"

[[decode]]
offset = 26
raw = 255
real = 215.0
source = { kind = "hand-calc", working = "PID 0x46 response 41 46 FF: A = 0xFF = 15*16 + 15 = 255; raw = A = 255; temperature = 255 - 40 = 215.0" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 29
raw = 60
real = 20.0
source = { kind = "hand-calc", working = "PID 0x46 response 41 46 3C: A = 0x3C = 3*16 + 12 = 60; raw = A = 60; temperature = 60 - 40 = 20.0" }

[[decode]]
offset = 32
raw = 0
real = -40.0
source = { kind = "hand-calc", working = "PID 0x5C response 41 5C 00: A = 0x00 = 0*16 + 0 = 0; raw = A = 0; temperature = 0 - 40 = -40.0" }
note = "boundary: every data byte 0x00"

[[decode]]
offset = 35
raw = 255
real = 215.0
source = { kind = "hand-calc", working = "PID 0x5C response 41 5C FF: A = 0xFF = 15*16 + 15 = 255; raw = A = 255; temperature = 255 - 40 = 215.0" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 38
raw = 130
real = 90.0
source = { kind = "hand-calc", working = "PID 0x5C response 41 5C 82: A = 0x82 = 8*16 + 2 = 130; raw = A = 130; temperature = 130 - 40 = 90.0" }

