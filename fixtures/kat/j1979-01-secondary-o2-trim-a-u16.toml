real = 99.21875
source = { kind = "hand-calc", working = "PID 0x56 response 41 56 FF FF: A = 0xFF = 15*16 + 15 = 255 (B is another signal, masked out); raw = A = 255; trim = 255*100/128 - 100 = 25500/128 - 100 = 199.21875 - 100 = 99.21875" }
note = "boundary: every data byte 0xFF"

[[decode]]
offset = 22
raw = 122
real = -4.6875
source = { kind = "hand-calc", working = "PID 0x56 response 41 56 7A 80: A = 0x7A = 7*16 + 10 = 122 (B is another signal, masked out); raw = A = 122; trim = 122*100/128 - 100 = 12200/128 - 100 = 95.3125 - 100 = -4.6875" }

