raw = 0
real = -128.0
source = { kind = "hand-calc", working = "PID 0x34 response 41 34 00 00 00 00: C = 0x00 = 0*16 + 0 = 0, D = 0x00 = 0*16 + 0 = 0 (A, B are another signal, masked out); raw = 256*0 + 0 = 0; current = 0/256 - 128 = 0.0 - 128 = -128.0" }
