# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "u24 little-endian: mixed bytes, top bit set, max, zero, just below the top bit"
notes = "Three-byte cells, little-endian: value = b2*65536 + b1*256 + b0."

[definition.encoding]
storage = "u24"
endian = "little"

[input]
hex = "56 34 12  00 00 80  FF FF FF  00 00 00  FF FF 7F"

[[decode]]
offset = 0
raw = 1193046
source = { kind = "hand-calc", working = "bytes 56 34 12 little-endian: 0x12*65536 + 0x34*256 + 0x56 = 1179648 + 13312 + 86 = 1193046 (0x123456)" }

[[decode]]
offset = 3
raw = 8388608
source = { kind = "hand-calc", working = "bytes 00 00 80 little-endian: 0x80*65536 + 0x00*256 + 0x00 = 128*65536 = 8388608; unsigned, no sign extension" }
note = "bit 23 set: must not be read as signed"

[[decode]]
offset = 6
raw = 16777215
source = { kind = "hand-calc", working = "bytes FF FF FF little-endian: 255*65536 + 255*256 + 255 = 16711680 + 65280 + 255 = 16777215 (u24 max)" }

[[decode]]
offset = 9
raw = 0
source = { kind = "hand-calc", working = "bytes 00 00 00 little-endian: u = 0*65536 + 0*256 + 0 = 0; raw = 0" }

[[decode]]
offset = 12
raw = 8388607
source = { kind = "hand-calc", working = "bytes FF FF 7F little-endian: u = 0x7F*65536 + 0xFF*256 + 0xFF = 8323072 + 65280 + 255 = 8388607 = 2^23 - 1, the value just below the bit-23 edge" }

