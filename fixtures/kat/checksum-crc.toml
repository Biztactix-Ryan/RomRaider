# Checksum reference vectors: CRCs in the Rocksoft parameter model
# (US-RR-14-7, PROJECT.md T2 (d), D-024).
#
# Sources:
# * The check values (the CRC of ASCII "123456789") are transcribed from Greg
#   Cook's "Catalogue of parametrised CRC algorithms" (CRC RevEng),
#   https://reveng.sourceforge.io/crc-catalogue/16.htm (CRC-16 entries) and
#   https://reveng.sourceforge.io/crc-catalogue/17plus.htm (CRC-32/ISO-HDLC),
#   both pages "Last updated 11 December 2024", retrieved 2026-10-22. Each
#   case's `params` are the entry's width/poly/init/refin/refout/xorout as
#   printed there.
# * The parameter model (WIDTH, POLY, INIT, REFIN, REFOUT, XOROUT, CHECK of
#   "123456789") is Ross N. Williams, "A Painless Guide to CRC Error Detection
#   Algorithms", version 3, 19 August 1993, section 15 "A Parameterized Model
#   For CRC Algorithms"; its "CRC-16" example (section 15, Check BB3D) and its
#   "CRC-32" entry (section 16, Check CBF43926) agree with the catalogue.
# * The empty-input and all-0xFF values are not printed in either source; they
#   are worked by hand from the model, bit by bit, in each case's working (an
#   empty input leaves the register at INIT; REFIN/REFOUT are worked with the
#   equivalent right-shifting register and reflected poly, Williams section 11).
# No code was run to produce any value: not rr-core, not rr-testkit, not
# legacy, not a throwaway script or calculator.
# crates/rr-testkit/tests/checksum_kat.rs re-derives every case with its own
# bit-by-bit implementation of the model on every test run.
#
# Families pinned (US-RR-35's `Crc16`; legacy semantics cited, values never
# taken from it): the GM E38 CVN is CRC-16/ARC. Its 256-entry table is the
# reflected table of poly 0x8005 (entry 1 = 0xC0C1, entry 0x80 = 0xA001,
# legacy/src/main/java/com/romraider/maps/checksum/ChecksumE38PCM.java:162-181),
# driven LSB-first with the register's low byte (:186-192), initial value 0
# and no final XOR (:224), chained over two ranges with the first result as
# the second's initial value (:224-225), byte-swapped (:199-211, :226) and
# stored big-endian (:84-85): that is the CRC stored little-endian (second
# case below). The other CRC-16 parameter sets are the `Crc16` options the
# engine offers (CRC-16/IBM-3740 a.k.a. CCITT-FALSE, XMODEM, KERMIT, MODBUS,
# IBM-SDLC); CRC-32/ISO-HDLC is the reference for widths above 16. No other
# legacy ROM checksum uses a CRC. The legacy NCS block CRC (NcsCoDec.calcCrc,
# legacy/src/main/java/com/romraider/maps/checksum/NcsCoDec.java:118-134:
# register 0xFFFF, LSB first, reflected poly 0x8408, no final XOR, i.e. the
# catalogue's CRC-16/MCRF4XX) is complemented and stored low byte first by its
# caller (legacy/src/main/java/com/romraider/io/j2534/api/TestJ2534NCS.java:
# 573-581); the complement of CRC-16/MCRF4XX is CRC-16/IBM-SDLC (same width,
# poly, init and reflection, xorout 0xFFFF; catalogue checks 0x6F91 and
# ~0x6F91 = 0x906E), so it is the IBM-SDLC case stored little-endian (US-RR-14-3).
schema = 1
title = "CRC-16 (ARC, IBM-3740, XMODEM, KERMIT, MODBUS, IBM-SDLC) and CRC-32/ISO-HDLC: check values, empty and all-0xFF inputs"
notes = """
Shared layout of the checksum vector fixtures (checksum-*.toml), one input:
  bytes  0..8   FF FF FF FF FF FF FF FF   all-0xFF block
  bytes  8..17  31 32 33 34 35 36 37 38 39  ASCII "123456789", the catalogue's check input
  bytes 17..21  00 00 00 00   the stored-checksum slot, zero as given
Every case reads its region and stores its result at offset 17. `before` is the
zero slot as given (valid only when the expected CRC is itself zero); `after`
is the slot once the CRC is fixed.

algorithm = "crc", params:
  catalogue   the RevEng catalogue name of the parameter set
  width, poly, init, refin, refout, xorout   the Rocksoft model parameters
  start, end  the region, half-open [start, end)
  store       byte order of the stored CRC, width/8 bytes
"""

# The documents these values rest on, as structured fields (US-RR-14-1,
# validator rule `citation`).
[[citation]]
kind = "standard"
doc = "Greg Cook, Catalogue of parametrised CRC algorithms (CRC RevEng)"
edition = "last updated 2024-12-11 (retrieved 2026-10-22)"
section = "https://reveng.sourceforge.io/crc-catalogue/16.htm entries CRC-16/ARC, CRC-16/IBM-3740, CRC-16/XMODEM, CRC-16/KERMIT, CRC-16/MODBUS, CRC-16/IBM-SDLC; https://reveng.sourceforge.io/crc-catalogue/17plus.htm entry CRC-32/ISO-HDLC"

[[citation]]
kind = "standard"
doc = "Ross N. Williams, A Painless Guide to CRC Error Detection Algorithms"
edition = "version 3, 1993-08-19"
section = "15 \"A Parameterized Model For CRC Algorithms\" (the model and its CRC-16 example); 16 (the CRC-32 parameter set); 11 (the reflected, right-shifting register)"

[input]
hex = """
FF FF FF FF FF FF FF FF
31 32 33 34 35 36 37 38 39
00 00 00 00
"""

