# Checksum reference vectors: additive sums of 16- and 32-bit words, big- and
# little-endian, plain, one's and two's complement, and the Subaru
# "sum to 0x5AA5A55A" form (US-RR-14-7, PROJECT.md T2 (d), D-024).
#
# There is no published standard for these sums, so every expected value is
# worked by hand below (each word, each addition, each wrap). No code was run
# to produce them: not rr-core, not rr-testkit, not legacy, not a throwaway
# script or calculator. crates/rr-testkit/tests/checksum_kat.rs re-derives
# every case with its own small reference implementation on every test run.
#
# Families pinned (the arithmetic of the checksum engine, US-RR-35, D-009;
# legacy semantics cited, values never taken from it):
# * 32-bit big-endian word sum mod 2^32: Nissan std/alt/alt2 `sumt`
#   (legacy/src/main/java/com/romraider/maps/checksum/CalculateSTD.java:47-50,
#   CalculateALT2.java:49-54, stored big-endian by NissanChecksum.java:78);
# * Subaru: stored = 0x5AA5A55A - (32-bit big-endian word sum), so the words
#   plus the stored value total 0x5AA5A55A
#   (legacy/src/main/java/com/romraider/maps/RomChecksum.java:101-116,
#   Settings.java:131 CHECK_TOTAL = 0x5AA5A55A); an empty range [0, 0) is
#   legacy's "disabled" entry, whose stored value is CHECK_TOTAL itself
#   (RomChecksum.java:55-57 and 82-86);
# * 16-bit big-endian word sum mod 2^16: Nissan alt2 calibration and code
#   sums (CalculateALT2.java:61-84) and the GM E38 segment sum, which is then
#   two's-complemented, ((sum & 0xFFFF) ^ 0xFFFF) + 1 (ChecksumE38PCM.java:213-220);
# * one's complement and the little-endian forms: the `negate` and `endian`
#   options of US-RR-35's `Sum{width, endian, init, negate}`; no legacy
#   algorithm uses them, but the engine offers them.
#
# Odd-length ranges: legacy has no padding convention. Its word loops step
# by the word size and read a whole word at each step (CalculateSTD.java:47-49,
# RomChecksum.java:103-104, ChecksumE38PCM.java:215-216), so a range whose
# length is not a multiple of the word reads the bytes just past `end`, and
# throws past the end of the image (RomAttributeParser.java:141-153). The
# vectors marked `pad = "zero"` pin the convention the engine adopts if it
# accepts such a range at all: the last partial word is completed with 0x00
# bytes at the higher addresses (so 0x39 is the big-endian word 0x3900 and
# the little-endian word 0x0039). Whether to accept such ranges or reject them
# is US-RR-35's call; a range without `pad` must be a whole number of words.
schema = 1
title = "Word sums (16/32-bit, big/little-endian, negated, Subaru 0x5AA5A55A): ASCII, all-0xFF, empty, wrap, odd length"
notes = """
Shared layout of the checksum vector fixtures (checksum-*.toml), one input:
  bytes  0..8   FF FF FF FF FF FF FF FF   all-0xFF block
  bytes  8..17  31 32 33 34 35 36 37 38 39  ASCII "123456789"
  bytes 17..21  00 00 00 00   the stored-checksum slot, zero as given
Every case reads its region and stores its result at offset 17. `before` is the
zero slot as given (valid only when the expected checksum is itself zero);
`after` is the slot once the checksum is fixed.

algorithm = "sum", params:
  start, end  the summed region, half-open [start, end)
  word        bytes per addend: 2 or 4, read unsigned in `endian` byte order
  endian      "big" | "little"
  width       accumulator bits; the sum is taken mod 2^width
  negate      "none" (default) | "ones": store ~sum = (2^width - 1) - sum |
              "twos": store -sum mod 2^width = (sum ^ (2^width - 1)) + 1
  target      instead of negate: store (target - sum) mod 2^width, so the
              region's words plus the stored value total `target` (Subaru)
  pad         "zero": a last partial word is completed with 0x00 bytes
  store       byte order of the stored result, width/8 bytes

Words of "12345678" (bytes 8..16):
  16-bit big-endian    0x3132 0x3334 0x3536 0x3738 = 12594 13108 13622 14136
  16-bit little-endian 0x3231 0x3433 0x3635 0x3837 = 12849 13363 13877 14391
  32-bit big-endian    0x31323334 0x35363738 = 825373492 892745528
  32-bit little-endian 0x34333231 0x38373635 = 875770417 943142453
"""

