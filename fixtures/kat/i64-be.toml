# Seed KAT fixture (US-RR-9-8). Every expected value is hand-calculated; the
# working shows the byte arithmetic. Cross-checked independently with Python
# int.from_bytes / struct.unpack (never with rr-core or rr-testkit code).
schema = 1
title = "i64 big-endian: min, -2, a positive, zero, max, -1"
notes = "u = hi*2^32 + lo (hi = bytes 0..4, lo = bytes 4..8, big-endian); two's complement: raw = u if u < 2^63, else u - 2^64 (18446744073709551616)."

[definition.encoding]
storage = "i64"
endian = "big"

[input]
hex = """
80 00 00 00 00 00 00 00
FF FF FF FF FF FF FF FE
00 00 00 01 00 00 00 00
00 00 00 00 00 00 00 00
7F FF FF FF FF FF FF FF
FF FF FF FF FF FF FF FF
"""

[[decode]]
offset = 0
raw = -9223372036854775808
source = { kind = "hand-calc", working = "bytes 80 00 00 00 00 00 00 00 big-endian: hi = 2147483648, lo = 0; u = 2147483648*4294967296 = 9223372036854775808; top bit set, two's complement: 9223372036854775808 - 18446744073709551616 = -9223372036854775808 (i64 min)" }

[[decode]]
offset = 8
raw = -2
source = { kind = "hand-calc", working = "bytes FF FF FF FF FF FF FF FE big-endian: hi = 4294967295, lo = 0xFFFFFFFE = 4294967294; u = 18446744069414584320 + 4294967294 = 18446744073709551614; two's complement: 18446744073709551614 - 18446744073709551616 = -2" }

[[decode]]
offset = 16
raw = 4294967296
source = { kind = "hand-calc", working = "bytes 00 00 00 01 00 00 00 00 big-endian: hi = 1, lo = 0; u = 1*4294967296 + 0 = 4294967296 = 2^32; below 2^63, raw = 4294967296" }
note = "a 32-bit truncation reads 0"

[[decode]]
offset = 24
raw = 0
source = { kind = "hand-calc", working = "bytes 00 00 00 00 00 00 00 00 big-endian: hi = 0, lo = 0; u = 0*4294967296 + 0 = 0; below 2^63, raw = 0" }

[[decode]]
offset = 32
raw = 9223372036854775807
source = { kind = "hand-calc", working = "bytes 7F FF FF FF FF FF FF FF big-endian: hi = 0x7FFFFFFF = 2147483647, lo = 4294967295; u = 2147483647*4294967296 + 4294967295 = 9223372032559808512 + 4294967295 = 9223372036854775807; below 2^63, raw = 9223372036854775807 (i64 max)" }

[[decode]]
offset = 40
raw = -1
source = { kind = "hand-calc", working = "bytes FF FF FF FF FF FF FF FF big-endian: hi = 4294967295, lo = 4294967295; u = 18446744069414584320 + 4294967295 = 18446744073709551615; two's complement: 18446744073709551615 - 18446744073709551616 = -1" }

