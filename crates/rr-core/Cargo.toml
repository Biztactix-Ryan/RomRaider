[package]
name = "rr-core"
description = "Pure concept types and algorithms; depends on no workspace crate and performs no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opens the capability-minting seal (`capability::authority`). Only rr-app and
# rr-cli may enable this; the T6 safety suite enforces that. See
# src/capability.rs.
confirmation-authority = []

[dependencies]

[dev-dependencies]
# Property tests for the clock (US-RR-18-2). Taken directly rather than via
# rr-testkit, which itself depends on rr-core.
proptest.workspace = true
# T6 compile-fail suite (tests/t6_token_compile_fail.rs, US-RR-7-1): trybuild
# runs the tests/ui cases as an external crate; serde only so a case can assert
# the tokens do not implement `Deserialize`.
trybuild.workspace = true
serde.workspace = true
# Golden snapshots of Provenance / Diagnostic rendering (US-RR-17-2). Taken
# directly for the same reason as proptest: rr-testkit depends on rr-core.
insta.workspace = true

# Evaluation throughput and thread scaling (US-RR-20-4, MF-25): a plain
# std-only benchmark, compiled in CI by clippy --all-targets, never run there.
[[bench]]
name = "expr_eval"
harness = false

[lints]
workspace = true
