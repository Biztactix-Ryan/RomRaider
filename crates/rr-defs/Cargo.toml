[package]
name = "rr-defs"
description = "Definition and profile readers producing layered, resolved definitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rr-core = { path = "../rr-core" }
# The hardened XML reader (src/xml.rs, US-RR-27-5): a pull parser that never
# processes a DTD or expands an entity itself; default features (no
# encoding_rs, no serde).
quick-xml.workspace = true

[dev-dependencies]
# Arbitrary-input property test of the XML reader (src/xml/tests.rs).
proptest.workspace = true
# Corpus-tier test (tests/corpus_defs_parse.rs, US-RR-27-4): the
# `corpus_test!` skip-reporting macro and the pinned definition list.
rr-testkit = { path = "../rr-testkit" }
# Definition-reader KATs (tests/kat_romraider_tables.rs, US-RR-29-2): the
# fixture model, loaded with rr-testkit's schema-checking TOML loader.
serde.workspace = true
# Snapshots of the reader's unknown-element/attribute warnings
# (tests/unknown_warnings.rs, US-RR-29-3).
insta.workspace = true

[lints]
workspace = true
