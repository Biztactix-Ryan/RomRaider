# Allowlist for `cargo xtask check-globals` (US-RR-3, ARCHITECTURE.md
# "Cross-cutting Standards", D-011, D-019).
#
# The workspace bans `static mut`, statics holding mutable state (Mutex, RwLock,
# Cell/RefCell/UnsafeCell, Atomic*, ...), lazy_static!/LazyLock/once_cell
# singletons holding such state, and thread_local! globals. In a stateless
# module (STATELESS_PATHS in xtask/src/globals.rs: the encoding module, MF-04)
# every static is banned, read-only OnceLock/LazyLock ones too. An exception needs
# an entry here, reviewed like code:
#
#   [[allow]]
#   path = "crates/rr-example/src/ffi.rs"   # relative to the workspace root
#   item = "CALLBACK_CTX"                   # the static's name
#   justification = "why no owned/passed-in alternative works"
#
# Entries with an empty justification fail the check, and so do stale entries
# whose item no longer exists.
#
# Both exceptions are test-only: the per-thread counters of the counting
# allocator of one test binary.

[[allow]]
path = "crates/rr-core/tests/expr_eval_no_alloc.rs"
item = "ALLOCATIONS"
justification = "Test binary only (US-RR-20-7, MF-25): a thread_local! Cell<usize> in which its #[global_allocator] counts the allocations each thread makes, to prove expression evaluation allocates nothing; a global allocator can report only through a static, and per-thread so that allocations by other threads of the test process (harness, output capture) are not charged to the evaluating thread. Nothing in shipping code reads or links it."

[[allow]]
path = "crates/rr-core/tests/expr_eval_no_alloc.rs"
item = "BYTES"
justification = "Test binary only (US-RR-20-8, SECURITY.md Formulas): a thread_local! Cell<usize> in which the same #[global_allocator] also sums the bytes it hands out to each thread, to prove a formula refused at a parser limit allocates no more than that limit allows; a global allocator can report only through a static, per-thread for the same reason. Nothing in shipping code reads or links it."
