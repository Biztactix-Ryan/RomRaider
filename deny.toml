# cargo-deny configuration for RomRaider-RS (story US-RR-2, D-016).
#
# Schema: cargo-deny 0.20.x. Run locally with `cargo deny check`.
# CI runs the same command in the `deny` job of .github/workflows/ci.yml.

[graph]
# Check every platform we ship on, not just the host, so a dependency pulled
# in only on Windows or aarch64 is still vetted.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

# --- Security advisories (RustSec) -------------------------------------------
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# With version 2, every vulnerability advisory is an error. Unmaintained and
# unsound advisories are errors for every crate in the graph; yanked versions
# are errors too.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Exceptions must name the advisory ID and carry a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: ..." }
ignore = []

# --- Licences -----------------------------------------------------------------
# Project licence is GPL-2.0-or-later (D-016). Only licences compatible with it
# are allowed. Apache-2.0 is compatible via the "or later" clause (GPLv3).
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93
# The allowlist is policy, not inventory: entries no crate uses yet are fine.
unused-allowed-license = "allow"
exceptions = []

# Our own crates are `publish = false` and GPL-2.0-or-later; don't licence-check
# them against the third-party allowlist.
[licenses.private]
ignore = true
registries = []

# --- Bans ---------------------------------------------------------------------
[bans]
# Two versions of the same crate: visible, but not a build failure.
multiple-versions = "warn"
# `*` version requirements are banned. Workspace-internal path dependencies
# (e.g. rr-testkit -> rr-core) carry no version; that is allowed for private
# (publish = false) crates only.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# --- Sources ------------------------------------------------------------------
# Only crates.io. No git dependencies, no alternative registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
