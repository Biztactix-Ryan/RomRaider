# Where each legacy-catalogue fixture lives (story US-RR-12, task US-RR-12-2).
#
# Every page of docs/legacy ends with a "Fixtures to write" table of stable
# IDs (LEG-<AREA>-NN). This map is the one record of where each ID is:
#
#   kat  = repository-relative paths of the KAT, fixture or test files that
#          already pin it (each path must exist);
#   task = the ProjectMan task that writes it, or writes what the listed files
#          do not cover yet (.project/tasks/<task>.md must exist and name the
#          ID in its title or body).
#
# An entry has `kat`, `task` or both. `cargo xtask check-legacy-docs` (rule 6
# of xtask/src/legacy_docs.rs) fails when the pages' IDs and this map's
# differ, a path does not exist, or a task is missing or does not name the
# ID. When a task's fixture lands, list its file under `kat` and drop `task`.

